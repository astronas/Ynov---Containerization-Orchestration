<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
<title id="t">Les limites de ressources : un conteneur qui s'emballe ne fait sauter que son propre disjoncteur</title>
<desc id="d">Le conteneur web tourne avec 13 programmes, loin de son plafond de 64. Il s'emballe : les programmes se multiplient, la jauge atteint le plafond, son disjoncteur bascule et les demandes en trop sont refusées. Le site répond toujours, et les voisins app et db restent en service.</desc>
<defs>
<linearGradient id="ynov" x1="0" x2="1">
<stop offset="0" stop-color="#ff1a1a"/><stop offset=".13" stop-color="#ff84ef"/>
<stop offset=".28" stop-color="#eeff57"/><stop offset=".47" stop-color="#5affb6"/>
<stop offset=".62" stop-color="#00eaff"/><stop offset=".8" stop-color="#859cff"/>
<stop offset=".89" stop-color="#4a8cff"/><stop offset="1" stop-color="#018e4d"/>
</linearGradient>

<style>
text{font-family:Bahnschrift,"Barlow Semi Condensed","Segoe UI",Arial,sans-serif}
.titre{font-size:26px;font-weight:700;fill:#fff}
.label{font-size:19px;font-weight:700}
.gros{font-size:24px;font-weight:700}
.petit{font-size:15px;fill:#a0a4a0}
.legende{font-size:19px;fill:#eaf0eb}
.boite{fill:#1d1d1d;stroke-width:2.5}
.mid{text-anchor:middle}.fin{text-anchor:end}.gras{font-weight:700}
.cy{fill:#00eaff}.mt{fill:#5affb6}.ja{fill:#eeff57}.ro{fill:#ff84ef}.la{fill:#859cff}.tq{fill:#1f9e91}.rg{fill:#ff1a1a}.bl{fill:#eaf0eb}.nr{fill:#0a0006}.gr{fill:#a0a4a0}
.s1,.s2,.s12{opacity:0}
.s1{animation:s1 9s infinite both}@keyframes s1{0%{opacity:0}4%,29%{opacity:1}33%,100%{opacity:0}}
.s2{animation:s2 9s infinite both}@keyframes s2{0%,31%{opacity:0}35%,59%{opacity:1}63%,100%{opacity:0}}
.s12{animation:s12 9s infinite both}@keyframes s12{0%{opacity:0}4%,59%{opacity:1}63%,100%{opacity:0}}
.a2{animation:a2 9s infinite both}@keyframes a2{0%,31%{opacity:0}35%,96%{opacity:1}100%{opacity:0}}
.a3{animation:a3 9s infinite both}@keyframes a3{0%,62%{opacity:0}66%,96%{opacity:1}100%{opacity:0}}

.pop{transform-box:fill-box;transform-origin:center;animation:pop 9s infinite both}
@keyframes pop{0%,31%{opacity:0;transform:scale(0)}34%,96%{opacity:1;transform:none}100%{opacity:0;transform:none}}
.jauge{transform-box:fill-box;transform-origin:left center;transform:none;fill:#eeff57;animation:jauge 9s infinite both}
@keyframes jauge{0%,31%{transform:scaleX(.2);fill:#00eaff}40%{transform:none;fill:#00eaff}42%,96%{transform:none;fill:#eeff57}100%{transform:scaleX(.2);fill:#00eaff}}
.levier{transform-box:view-box;transform-origin:295px 132px;transform:rotate(60deg);animation:levier 9s infinite both}
@keyframes levier{0%,41%{transform:none}44%,96%{transform:rotate(60deg)}100%{transform:none}}
.refuse{opacity:0;animation:refuse 9s infinite both}
@keyframes refuse{0%,43%{opacity:0}45%{opacity:1;transform:none}56%{opacity:0;transform:translateX(30px)}100%{opacity:0}}
.trip{animation:trip 9s infinite both}
@keyframes trip{0%,42%{opacity:0}45%,96%{opacity:1}100%{opacity:0}}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 2.25s infinite ease-in-out}
@keyframes halo{0%,100%{transform:none}50%{transform:scale(1.15)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</defs>
<rect width="960" height="420" rx="18" fill="#0a0006"/>
<rect width="960" height="6" fill="url(#ynov)"/>
<text class="titre" x="32" y="52">Un disjoncteur par appartement</text>
<text class="petit" x="32" y="78">les limites de ressources d'un conteneur : mémoire, processeur, nombre de programmes</text>
<rect class="boite" x="40" y="100" width="290" height="250" rx="14" stroke="#00eaff"/><text class="label cy" x="60" y="134">web</text><text class="petit" x="60" y="156">au plus 64 programmes</text><rect x="280" y="112" width="30" height="40" rx="4" fill="#0a0006" stroke="#a0a4a0" stroke-width="2"/><g class="levier"><path d="M295 132 V116" stroke="#eaf0eb" stroke-width="4" stroke-linecap="round"/></g>
<circle cx="70" cy="188" r="7" fill="#00eaff"/>
<circle cx="94" cy="188" r="7" fill="#00eaff"/>
<circle cx="118" cy="188" r="7" fill="#00eaff"/>
<circle class="pop" cx="142" cy="188" r="7" fill="#00eaff" style="animation-delay:0.00s"/>
<circle class="pop" cx="166" cy="188" r="7" fill="#00eaff" style="animation-delay:0.04s"/>
<circle class="pop" cx="190" cy="188" r="7" fill="#00eaff" style="animation-delay:0.08s"/>
<circle class="pop" cx="214" cy="188" r="7" fill="#00eaff" style="animation-delay:0.12s"/>
<circle class="pop" cx="238" cy="188" r="7" fill="#00eaff" style="animation-delay:0.16s"/>
<circle class="pop" cx="262" cy="188" r="7" fill="#00eaff" style="animation-delay:0.20s"/>
<circle class="pop" cx="286" cy="188" r="7" fill="#00eaff" style="animation-delay:0.24s"/>
<circle class="pop" cx="70" cy="212" r="7" fill="#00eaff" style="animation-delay:0.28s"/>
<circle class="pop" cx="94" cy="212" r="7" fill="#00eaff" style="animation-delay:0.32s"/>
<circle class="pop" cx="118" cy="212" r="7" fill="#00eaff" style="animation-delay:0.36s"/>
<circle class="pop" cx="142" cy="212" r="7" fill="#00eaff" style="animation-delay:0.40s"/>
<circle class="pop" cx="166" cy="212" r="7" fill="#00eaff" style="animation-delay:0.44s"/>
<circle class="pop" cx="190" cy="212" r="7" fill="#00eaff" style="animation-delay:0.48s"/>
<circle class="pop" cx="214" cy="212" r="7" fill="#00eaff" style="animation-delay:0.52s"/>
<circle class="pop" cx="238" cy="212" r="7" fill="#00eaff" style="animation-delay:0.56s"/>
<circle class="pop" cx="262" cy="212" r="7" fill="#00eaff" style="animation-delay:0.60s"/>
<circle class="pop" cx="286" cy="212" r="7" fill="#00eaff" style="animation-delay:0.64s"/>
<g class="refuse"><circle cx="150" cy="171" r="6" fill="#ff1a1a"/><circle cx="174" cy="171" r="6" fill="#ff1a1a"/><circle cx="198" cy="171" r="6" fill="#ff1a1a"/></g>
<rect x="60" y="244" width="250" height="18" rx="9" fill="#262626"/><rect class="jauge" x="60" y="244" width="250" height="18" rx="9"/><path d="M310 238 V268" stroke="#ff1a1a" stroke-width="3"/><text class="petit fin" x="310" y="286">64</text>
<g class="s1"><text class="petit" x="60" y="306">13 programmes, loin du plafond</text></g><g class="trip"><text class="label rg" x="60" y="302">Plafond atteint</text><text class="petit" x="60" y="321">fork refusé au-delà de 64</text></g><g class="a3"><text class="petit mt gras" x="60" y="339">et le site répond toujours</text></g>
<rect class="boite" x="350" y="100" width="270" height="250" rx="14" stroke="#859cff"/><text class="label la" x="370" y="134">app</text><text class="petit" x="370" y="156">un voisin</text><circle class="halo" cx="485" cy="216" r="40" fill="#eeff57" fill-opacity=".14"/><circle cx="485" cy="216" r="24" fill="#eeff57"/><path d="M477 244 h16 v10 h-16 z" fill="#a0a4a0"/><text class="label mt mid" x="485" y="296">en service</text><g class="a3"><text class="petit mid" x="485" y="322">rien n'a sauté chez lui</text></g>
<rect class="boite" x="650" y="100" width="270" height="250" rx="14" stroke="#859cff"/><text class="label la" x="670" y="134">db</text><text class="petit" x="670" y="156">un voisin</text><circle class="halo" cx="785" cy="216" r="40" fill="#eeff57" fill-opacity=".14"/><circle cx="785" cy="216" r="24" fill="#eeff57"/><path d="M777 244 h16 v10 h-16 z" fill="#a0a4a0"/><text class="label mt mid" x="785" y="296">en service</text><g class="a3"><text class="petit mid" x="785" y="322">rien n'a sauté chez lui</text></g>
<rect x="0" y="366" width="960" height="54" fill="#15101a"/>
<text class="legende" x="32" y="400">Un conteneur qui s'emballe bute sur ses propres limites : les voisins tournent.</text>
</svg>
