<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
<title id="t">Une couche est la liste des changements d'une étape</title>
<desc id="d">Trois cartes s'empilent, une par étape de fabrication, chacune ne listant que ses changements : ajout de /bin, ajout de python3 et modification de /etc/config, ajout de app.py. Puis la vue du conteneur apparaît : une seule racine, où la version 2 de /etc/config, celle de la couche du haut, gagne et masque la version 1.</desc>
<defs>
<linearGradient id="ynov" x1="0" x2="1">
<stop offset="0" stop-color="#ff1a1a"/><stop offset=".13" stop-color="#ff84ef"/>
<stop offset=".28" stop-color="#eeff57"/><stop offset=".47" stop-color="#5affb6"/>
<stop offset=".62" stop-color="#00eaff"/><stop offset=".8" stop-color="#859cff"/>
<stop offset=".89" stop-color="#4a8cff"/><stop offset="1" stop-color="#018e4d"/>
</linearGradient>
<marker id="fm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#5affb6"/></marker>
<style>
text{font-family:Bahnschrift,"Barlow Semi Condensed","Segoe UI",Arial,sans-serif}
.titre{font-size:26px;font-weight:700;fill:#fff}
.label{font-size:19px;font-weight:700}
.txt{font-size:17px;fill:#eaf0eb}
.petit{font-size:15px;fill:#a0a4a0}
.etape{font-size:17px;fill:#eaf0eb}
.legende{font-size:19px;fill:#eaf0eb}
.a1,.a2,.a3,.f1,.f2,.f3,.p2,.p3,.e1,.e2,.e3,.h2,.h3{animation-duration:8s;animation-iteration-count:infinite;animation-fill-mode:both}
.a1{animation-name:a1}.a2{animation-name:a2}.a3{animation-name:a3}
.f1{animation-name:f1}.f2{animation-name:f2}.f3{animation-name:f3}
.p2,.p3{transform-box:fill-box;transform-origin:center}
.p2{animation-name:p2}.p3{animation-name:p3}
.e1{animation-name:e1}.e2{animation-name:e2}.e3{animation-name:e3}
.h2{animation-name:h2}.h3{animation-name:h3}
@keyframes a1{0%{opacity:0;transform:translateY(-24px)}6%,95%{opacity:1;transform:none}100%{opacity:0}}
@keyframes a2{0%,35%{opacity:0;transform:translateY(-24px)}41%,95%{opacity:1;transform:none}100%{opacity:0}}
@keyframes a3{0%,65%{opacity:0;transform:translateY(-24px)}71%,95%{opacity:1;transform:none}100%{opacity:0}}
@keyframes f1{0%{opacity:0}6%,95%{opacity:1}100%{opacity:0}}
@keyframes f2{0%,35%{opacity:0}41%,95%{opacity:1}100%{opacity:0}}
@keyframes f3{0%,65%{opacity:0}71%,95%{opacity:1}100%{opacity:0}}
@keyframes p2{0%,35%{opacity:0;transform:scale(.5)}40%{opacity:1;transform:scale(1.12)}44%,95%{opacity:1;transform:none}100%{opacity:0}}
@keyframes p3{0%,65%{opacity:0;transform:scale(.5)}70%{opacity:1;transform:scale(1.12)}74%,95%{opacity:1;transform:none}100%{opacity:0}}
@keyframes e1{0%{opacity:0}4%,31%{opacity:1}35%,100%{opacity:0}}
@keyframes e2{0%,35%{opacity:0}39%,61%{opacity:1}65%,100%{opacity:0}}
@keyframes e3{0%,65%{opacity:0}69%,95%{opacity:1}100%{opacity:0}}
@keyframes h2{0%,34%{opacity:1}39%,100%{opacity:0}}
@keyframes h3{0%,64%{opacity:1}69%,100%{opacity:0}}
.rm{display:none}

@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.a1,.a2,.a3,.f1,.f2,.f3,.p2,.p3{opacity:1;transform:none}
.e1,.e2,.e3,.h2,.h3{opacity:0}
.rm{display:inline}
}
</style>
</defs>
<rect width="960" height="420" rx="18" fill="#0a0006"/>
<rect width="960" height="6" fill="url(#ynov)"/>
<text class="titre" x="32" y="52">Une couche = ce qui a changé</text>
<text class="etape e1" x="32" y="84"><tspan fill="#eeff57" font-weight="700">1.</tspan> Chaque étape de la recette enregistre seulement ce qu'elle a changé</text>
<text class="etape e2" x="32" y="84"><tspan fill="#eeff57" font-weight="700">2.</tspan> Les couches s'empilent : l'image, c'est toute la pile</text>
<text class="etape e3" x="32" y="84"><tspan fill="#eeff57" font-weight="700">3.</tspan> Le conteneur voit une seule racine ; un fichier en double ? celle du haut gagne</text>
<text class="etape rm" x="32" y="84">Chaque couche liste ses changements ; empilées, celle du haut gagne en cas de doublon</text>

<g class="a1" style=""><rect x="32" y="270" width="440" height="70" rx="14" fill="#1d1d1d" stroke="#859cff" stroke-width="2.5"/><text class="label" x="50" y="300" fill="#859cff">Couche 1</text><text class="petit" x="50" y="324">FROM debian</text><text x="250" y="300" font-size="17" fill="#eaf0eb">+ /bin, /usr …</text><text x="250" y="324" font-size="17" fill="#eaf0eb">+ /etc/config (v1)</text></g>
<path class="f3" d="M248 318 H392" stroke="#a0a4a0" stroke-width="2"/>
<text class="f3" x="404" y="324" font-size="15" font-weight="700" fill="#a0a4a0">masqué</text>
<g class="a1" style="animation-delay:.9s"><rect x="32" y="186" width="440" height="70" rx="14" fill="#1d1d1d" stroke="#00eaff" stroke-width="2.5"/><text class="label" x="50" y="216" fill="#00eaff">Couche 2</text><text class="petit" x="50" y="240">RUN apt install python3</text><text x="250" y="216" font-size="17" fill="#eaf0eb">+ /usr/bin/python3</text><text x="250" y="240" font-size="17" fill="#eaf0eb">~ /etc/config (v2)</text></g>
<g class="a2" style=""><rect x="32" y="102" width="440" height="70" rx="14" fill="#1d1d1d" stroke="#5affb6" stroke-width="2.5"/><text class="label" x="50" y="132" fill="#5affb6">Couche 3</text><text class="petit" x="50" y="156">COPY app.py /app/</text><text x="250" y="144" font-size="17" fill="#eaf0eb">+ /app/app.py</text></g>
<path class="f3" d="M484 222 H542" stroke="#5affb6" stroke-width="3" marker-end="url(#fm)"/>
<rect x="560" y="102" width="370" height="238" rx="14" fill="#1d1d1d" stroke="#a0a4a0" stroke-width="2.5"/>
<text class="label" x="578" y="132" fill="#eaf0eb">Ce que voit le conteneur</text>
<text class="petit" x="578" y="154">OverlayFS superpose les couches</text>
<text class="txt a3" x="578" y="190" style="fill:#859cff">/bin, /usr …</text>
<text class="txt a3" x="578" y="220" style="fill:#00eaff;animation-delay:.15s">/usr/bin/python3</text>
<text class="txt a3" x="578" y="250" style="fill:#00eaff;animation-delay:.3s">/etc/config (v2)</text>
<text class="txt a3" x="578" y="280" style="fill:#5affb6;animation-delay:.45s">/app/app.py</text>
<g class="p3" style="animation-delay:.4s"><rect x="728" y="232" width="186" height="26" rx="7" fill="#eeff57" stroke="#eeff57" stroke-width="2"/><text x="821.0" y="250.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0a0006">celle du haut gagne</text></g>
<text class="petit" x="578" y="322">+ ajouté</text><text class="petit" x="660" y="322">~ modifié</text>

<rect x="0" y="366" width="960" height="54" fill="#15101a"/>
<text class="legende" x="32" y="400">Une couche = la liste des ajouts, modifications et suppressions d'une étape.</text>
</svg>
