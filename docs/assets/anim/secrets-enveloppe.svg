<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
<title id="t">Une variable d'environnement est un post-it lisible par tous, un secret monté une enveloppe remise à un seul service</title>
<desc id="d">À gauche, le mot de passe est un post-it collé sur l'écran : docker inspect, /proc/1/environ et les journaux le lisent tour à tour. À droite, le secret est une enveloppe remise au seul service db, dans /run/secrets, en lecture seule ; web ne reçoit rien.</desc>
<defs>
<linearGradient id="ynov" x1="0" x2="1">
<stop offset="0" stop-color="#ff1a1a"/><stop offset=".13" stop-color="#ff84ef"/>
<stop offset=".28" stop-color="#eeff57"/><stop offset=".47" stop-color="#5affb6"/>
<stop offset=".62" stop-color="#00eaff"/><stop offset=".8" stop-color="#859cff"/>
<stop offset=".89" stop-color="#4a8cff"/><stop offset="1" stop-color="#018e4d"/>
</linearGradient>

<style>
text{font-family:Bahnschrift,"Barlow Semi Condensed","Segoe UI",Arial,sans-serif}
.titre{font-size:26px;font-weight:700;fill:#fff}
.label{font-size:19px;font-weight:700}
.gros{font-size:24px;font-weight:700}
.petit{font-size:15px;fill:#a0a4a0}
.legende{font-size:19px;fill:#eaf0eb}
.boite{fill:#1d1d1d;stroke-width:2.5}
.mid{text-anchor:middle}.fin{text-anchor:end}.gras{font-weight:700}
.cy{fill:#00eaff}.mt{fill:#5affb6}.ja{fill:#eeff57}.ro{fill:#ff84ef}.la{fill:#859cff}.tq{fill:#1f9e91}.rg{fill:#ff1a1a}.bl{fill:#eaf0eb}.nr{fill:#0a0006}.gr{fill:#a0a4a0}
.s1,.s2,.s12{opacity:0}
.s1{animation:s1 9s infinite both}@keyframes s1{0%{opacity:0}4%,29%{opacity:1}33%,100%{opacity:0}}
.s2{animation:s2 9s infinite both}@keyframes s2{0%,31%{opacity:0}35%,59%{opacity:1}63%,100%{opacity:0}}
.s12{animation:s12 9s infinite both}@keyframes s12{0%{opacity:0}4%,59%{opacity:1}63%,100%{opacity:0}}
.a2{animation:a2 9s infinite both}@keyframes a2{0%,31%{opacity:0}35%,96%{opacity:1}100%{opacity:0}}
.a3{animation:a3 9s infinite both}@keyframes a3{0%,62%{opacity:0}66%,96%{opacity:1}100%{opacity:0}}

.lit{animation:lit 9s infinite both}
@keyframes lit{0%{opacity:0}4%,96%{opacity:1}100%{opacity:0}}
.env{transform:translate(184px,-6px);animation:env 9s infinite both}
@keyframes env{0%{opacity:0;transform:none}4%,32%{opacity:1;transform:none}44%,96%{opacity:1;transform:translate(184px,-6px)}100%{opacity:0;transform:translate(184px,-6px)}}
.recu{animation:recu 9s infinite both}
@keyframes recu{0%,43%{opacity:0}47%,96%{opacity:1}100%{opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</defs>
<rect width="960" height="420" rx="18" fill="#0a0006"/>
<rect width="960" height="6" fill="url(#ynov)"/>
<text class="titre" x="32" y="52">Post-it ou enveloppe ?</text>
<text class="petit" x="32" y="78">deux façons de donner un mot de passe à un conteneur</text>
<rect class="boite" x="30" y="96" width="440" height="262" rx="14" stroke="#eeff57"/><text class="label ja" x="50" y="128">Variable d'environnement</text>
<rect x="150" y="144" width="200" height="110" rx="8" fill="#0a0006" stroke="#a0a4a0" stroke-width="2.5"/><path d="M235 254 h30 l8 14 h-46 z" fill="#a0a4a0"/>
<g transform="rotate(-4 250 192)"><rect x="200" y="160" width="100" height="62" fill="#eeff57"/><text class="label nr" x="212" y="184" style="font-size:16px">mdp :</text><text class="label nr" x="212" y="208" style="font-size:16px">soleil42</text></g>
<g class="lit" style="animation-delay:0.5s"><path d="M108 278 L250 226" stroke="#ff1a1a" stroke-width="2" stroke-dasharray="5 5"/><rect x="40" y="278" width="136" height="28" rx="14" fill="#1d1d1d" stroke="#ff1a1a" stroke-width="2"/><text class="petit bl mid" x="108" y="297">docker inspect</text></g>
<g class="lit" style="animation-delay:1s"><path d="M252 278 L250 226" stroke="#ff1a1a" stroke-width="2" stroke-dasharray="5 5"/><rect x="184" y="278" width="136" height="28" rx="14" fill="#1d1d1d" stroke="#ff1a1a" stroke-width="2"/><text class="petit bl mid" x="252" y="297">/proc/1/environ</text></g>
<g class="lit" style="animation-delay:1.5s"><path d="M394 278 L250 226" stroke="#ff1a1a" stroke-width="2" stroke-dasharray="5 5"/><rect x="328" y="278" width="132" height="28" rx="14" fill="#1d1d1d" stroke="#ff1a1a" stroke-width="2"/><text class="petit bl mid" x="394" y="297">journaux</text></g>
<g class="a3"><rect x="40" y="318" width="420" height="30" rx="15" fill="#3a0a0a" stroke="#ff1a1a" stroke-width="2"/><text class="petit rg gras mid" x="250" y="339">lisible par tous : jamais pour un secret</text></g>
<rect class="boite" x="490" y="96" width="440" height="262" rx="14" stroke="#5affb6"/><text class="label mt" x="510" y="128">Secret monté</text><rect class="boite" x="700" y="146" width="210" height="82" rx="10" stroke="#00eaff"/><text class="label cy" x="780" y="172">db</text><rect class="boite" x="700" y="240" width="210" height="62" rx="10" stroke="#a0a4a0"/><text class="label bl" x="780" y="266">web</text><g class="recu"><text class="petit" x="780" y="194">/run/secrets/…</text><text class="petit mt gras" x="780" y="214">lecture seule</text><text class="petit" x="780" y="288">rien reçu</text></g>
<g class="s1"><text class="petit" x="516" y="236">mot de passe root</text><text class="petit" x="516" y="256">de la base</text></g><g class="recu"><text class="petit" x="516" y="236">remis en main propre</text><text class="petit" x="516" y="256">au seul service db</text></g>
<g class="env"><rect x="520" y="164" width="56" height="38" rx="4" fill="#eaf0eb"/><path d="M520 166 l28 20 l28 -20" fill="none" stroke="#0a0006" stroke-width="2.5"/></g>
<g class="a3"><rect x="500" y="318" width="420" height="30" rx="15" fill="#0a2a1c" stroke="#5affb6" stroke-width="2"/><text class="petit mt gras mid" x="710" y="339">un seul destinataire, qui ne peut pas la réécrire</text></g>
<rect x="0" y="366" width="960" height="54" fill="#15101a"/>
<text class="legende" x="32" y="400">Un secret se remet en enveloppe au seul service concerné, jamais en post-it.</text>
</svg>
