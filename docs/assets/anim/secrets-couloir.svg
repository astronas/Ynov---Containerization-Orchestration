<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
<title id="t">Le réseau dédié filtre qui entre dans le couloir, la serrure de la base décide du reste</title>
<desc id="d">Un conteneur d'un autre réseau ne trouve pas le couloir : nom inconnu. Le service app traverse le couloir jusqu'à la base, la serrure reconnaît son mot de passe et lui ouvre. Un voisin compromis du même réseau frappe à son tour à la porte de la base : la serrure refuse.</desc>
<defs>
<linearGradient id="ynov" x1="0" x2="1">
<stop offset="0" stop-color="#ff1a1a"/><stop offset=".13" stop-color="#ff84ef"/>
<stop offset=".28" stop-color="#eeff57"/><stop offset=".47" stop-color="#5affb6"/>
<stop offset=".62" stop-color="#00eaff"/><stop offset=".8" stop-color="#859cff"/>
<stop offset=".89" stop-color="#4a8cff"/><stop offset="1" stop-color="#018e4d"/>
</linearGradient>
<g id="cadenas"><path d="M-6 -2 v-6 a6 6 0 0 1 12 0 v6" fill="none" stroke-width="3"/><rect x="-10" y="-3" width="20" height="16" rx="3" stroke="none"/></g>
<style>
text{font-family:Bahnschrift,"Barlow Semi Condensed","Segoe UI",Arial,sans-serif}
.titre{font-size:26px;font-weight:700;fill:#fff}
.label{font-size:19px;font-weight:700}
.gros{font-size:24px;font-weight:700}
.petit{font-size:15px;fill:#a0a4a0}
.legende{font-size:19px;fill:#eaf0eb}
.boite{fill:#1d1d1d;stroke-width:2.5}
.mid{text-anchor:middle}.fin{text-anchor:end}.gras{font-weight:700}
.cy{fill:#00eaff}.mt{fill:#5affb6}.ja{fill:#eeff57}.ro{fill:#ff84ef}.la{fill:#859cff}.tq{fill:#1f9e91}.rg{fill:#ff1a1a}.bl{fill:#eaf0eb}.nr{fill:#0a0006}.gr{fill:#a0a4a0}
.s1,.s2,.s12{opacity:0}
.s1{animation:s1 9s infinite both}@keyframes s1{0%{opacity:0}4%,29%{opacity:1}33%,100%{opacity:0}}
.s2{animation:s2 9s infinite both}@keyframes s2{0%,31%{opacity:0}35%,59%{opacity:1}63%,100%{opacity:0}}
.s12{animation:s12 9s infinite both}@keyframes s12{0%{opacity:0}4%,59%{opacity:1}63%,100%{opacity:0}}
.a2{animation:a2 9s infinite both}@keyframes a2{0%,31%{opacity:0}35%,96%{opacity:1}100%{opacity:0}}
.a3{animation:a3 9s infinite both}@keyframes a3{0%,62%{opacity:0}66%,96%{opacity:1}100%{opacity:0}}

.front{opacity:0;animation:front 9s infinite both}
@keyframes front{0%{opacity:0;transform:none}4%{opacity:1;transform:none}14%{transform:translateX(48px)}17%{transform:translateX(34px)}20%{transform:translateX(48px)}24%,28%{opacity:1;transform:translateX(36px)}31%,100%{opacity:0;transform:translateX(36px)}}
.app{opacity:0;animation:app 9s infinite both}
@keyframes app{0%,30%{opacity:0;transform:none}32%{opacity:1;transform:none}34%{transform:translate(0,43px)}39%{transform:translate(397px,43px)}40%{transform:translate(405px,43px)}41%{transform:translate(397px,43px)}42%{transform:translate(405px,43px)}43%,45%{transform:translate(397px,43px)}51%{opacity:1;transform:translate(425px,-50px)}54%,100%{opacity:0;transform:translate(425px,-50px)}}
.vois{transform:translate(196px,-52px);animation:vois 9s infinite both}
@keyframes vois{0%,62%{opacity:0;transform:none}64%{opacity:1;transform:none}67%{transform:translate(0,-52px)}74%{transform:translate(222px,-52px)}76%{transform:translate(214px,-52px)}78%{transform:translate(222px,-52px)}82%,96%{opacity:1;transform:translate(196px,-52px)}100%{opacity:0;transform:translate(196px,-52px)}}
.okv{opacity:0;animation:okv 9s infinite both}
@keyframes okv{0%,42%{opacity:0}44%,59%{opacity:1}62%,100%{opacity:0}}
.non{animation:non 9s infinite both}
@keyframes non{0%,75%{opacity:0}78%,96%{opacity:1}100%{opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</defs>
<rect width="960" height="420" rx="18" fill="#0a0006"/>
<rect width="960" height="6" fill="url(#ynov)"/>
<text class="titre" x="32" y="52">Le réseau dédié : un couloir privé</text>
<text class="petit" x="32" y="78">seuls ceux qui y ont un bureau s'y croisent</text>
<rect x="230" y="196" width="690" height="64" rx="10" fill="#15101a" stroke="#1f9e91" stroke-width="2.5"/><path d="M230 184 V272" stroke="#a0a4a0" stroke-width="6"/><text class="petit tq gras" x="246" y="252">couloir : réseau back</text>
<rect class="boite" x="30" y="196" width="120" height="64" rx="10" stroke="#ff84ef"/><text class="label ro" x="46" y="224">front</text><text class="petit" x="46" y="246">autre réseau</text>
<rect class="boite" x="340" y="100" width="150" height="70" rx="10" stroke="#00eaff"/><text class="label cy" x="356" y="130">app</text><text class="petit" x="356" y="154">a le mot de passe</text>
<rect class="boite" x="500" y="290" width="190" height="62" rx="10" stroke="#a0a4a0"/><text class="label bl" x="516" y="318">voisin</text><text class="petit" x="516" y="340">même réseau</text>
<g class="non"><rect x="500" y="290" width="190" height="62" rx="10" fill="none" stroke="#ff1a1a" stroke-width="2.5"/><text class="petit rg gras" x="586" y="318">compromis</text></g>
<rect class="boite" x="760" y="100" width="160" height="70" rx="10" stroke="#eeff57"/><text class="label ja" x="776" y="130">db</text><text class="petit" x="776" y="154">MariaDB</text>
<use href="#cadenas" x="860" y="184" fill="#a0a4a0" stroke="#a0a4a0"/>
<g class="okv"><use href="#cadenas" x="860" y="184" fill="#5affb6" stroke="#5affb6"/></g>
<g class="non"><use href="#cadenas" x="860" y="184" fill="#ff1a1a" stroke="#ff1a1a"/></g>
<g class="front"><circle cx="164" cy="228" r="12" fill="#ff84ef"/></g>
<g class="s1"><text class="petit rg gras" x="30" y="290">nom inconnu :</text><text class="petit rg gras" x="30" y="310">hors du couloir</text></g>
<g class="app"><circle cx="415" cy="185" r="14" fill="#00eaff"/></g>
<g class="vois"><circle cx="590" cy="282" r="14" fill="#ff1a1a"/></g>
<g class="okv"><text class="label mt" x="706" y="312">Serrure : accès OK</text><text class="petit" x="706" y="334">bon mot de passe, bons droits</text></g>
<g class="a3"><text class="label rg" x="706" y="312">Serrure : refusé</text><text class="petit" x="706" y="334">pas le mot de passe</text></g>
<rect x="0" y="366" width="960" height="54" fill="#15101a"/>
<text class="legende" x="32" y="400">Le réseau choisit qui entre dans le couloir ; la serrure de la base décide du reste.</text>
</svg>
