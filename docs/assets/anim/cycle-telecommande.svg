<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">La télécommande et le moteur : le client docker, dockerd, le registre, containerd et runc</title>
  <desc id="d">On tape docker run nginx sur la télécommande, le client docker : l'ordre part vers le moteur dockerd, qui tourne en permanence. Le moteur va chercher l'image nginx dans le registre, un entrepôt qui stocke les images sans rien exécuter. Puis il confie la fabrication à deux ouvriers, containerd et runc, et le conteneur nginx apparaît, en marche.</desc>
  <defs>
    <linearGradient id="ynov" x1="0" x2="1">
      <stop offset="0" stop-color="#ff1a1a"/><stop offset=".13" stop-color="#ff84ef"/>
      <stop offset=".28" stop-color="#eeff57"/><stop offset=".47" stop-color="#5affb6"/>
      <stop offset=".62" stop-color="#00eaff"/><stop offset=".8" stop-color="#859cff"/>
      <stop offset=".89" stop-color="#4a8cff"/><stop offset="1" stop-color="#018e4d"/>
    </linearGradient>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#a0a4a0"/></marker>
    <style>
      text { font-family: Bahnschrift, "Barlow Semi Condensed", "Segoe UI", Arial, sans-serif; }
      .titre { font-size: 26px; font-weight: 700; fill: #fff; }
      .label { font-size: 19px; font-weight: 700; }
      .l18 { font-size: 18px; font-weight: 700; }
      .petit { font-size: 15px; fill: #a0a4a0; }
      .code { font-size: 15px; font-weight: 700; fill: #00eaff; font-family: Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace; }
      .legende { font-size: 19px; fill: #eaf0eb; }
      .etape { font-size: 18px; font-weight: 700; text-anchor: end; }
      .m { text-anchor: middle; }
      .boite { fill: #1d1d1d; stroke-width: 2.5; }
      /* 8 s : 1 l'ordre part, 2 le moteur va chercher l'image, 3 les ouvriers fabriquent le conteneur */
      .a1, .a2, .a3 { animation: 8s infinite both; opacity: 0; }
      .a1 { animation-name: a1; } .a2 { animation-name: a2; } .a3 { animation-name: a3; }
      @keyframes a1 { 0%, 31% { opacity: 1; } 34%, 100% { opacity: 0; } }
      @keyframes a2 { 0%, 31% { opacity: 0; } 34%, 64% { opacity: 1; } 67%, 100% { opacity: 0; } }
      @keyframes a3 { 0%, 64% { opacity: 0; } 67%, 97% { opacity: 1; } 100% { opacity: 0; } }
      .bouton { animation: bouton 8s infinite both; }
      @keyframes bouton { 0%, 3% { fill: #1d1d1d; } 5%, 10% { fill: #5affb6; } 13%, 100% { fill: #1d1d1d; } }
      .signal { animation: signal 8s infinite both; opacity: 0; }
      @keyframes signal { 0%, 8% { opacity: 0; transform: translateX(0); } 10% { opacity: 1; } 26% { opacity: 1; transform: translateX(104px); } 28%, 100% { opacity: 0; transform: translateX(104px); } }
      .image { animation: image 8s infinite both; opacity: 0; }
      @keyframes image { 0%, 36% { opacity: 0; transform: translate(0, 0); } 40% { opacity: 1; transform: translate(0, 0); } 58%, 97% { opacity: 1; transform: translate(-268px, 76px); } 100% { opacity: 0; transform: translate(-268px, 76px); } }
      .p1 { animation: p1 8s infinite both; opacity: 0; }
      @keyframes p1 { 0%, 67% { opacity: 0; transform: translateX(0); } 68% { opacity: 1; } 73% { opacity: 1; transform: translateX(40px); } 75%, 100% { opacity: 0; transform: translateX(40px); } }
      .p2 { animation: p2 8s infinite both; opacity: 0; }
      @keyframes p2 { 0%, 74% { opacity: 0; transform: translateX(0); } 75% { opacity: 1; } 80% { opacity: 1; transform: translateX(30px); } 82%, 100% { opacity: 0; transform: translateX(30px); } }
      .ct { transform-box: fill-box; transform-origin: center; animation: ct 8s infinite both; opacity: 0; }
      @keyframes ct { 0%, 81% { opacity: 0; transform: scale(.6); } 85% { opacity: 1; transform: scale(1.06); } 88%, 97% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
      .lueur { animation: lueur 8s infinite both; fill-opacity: 0; }
      @keyframes lueur { 0%, 25% { fill-opacity: 0; } 28%, 33% { fill-opacity: .25; } 37%, 56% { fill-opacity: 0; } 59%, 66% { fill-opacity: .25; } 70%, 100% { fill-opacity: 0; } }
      .rouage { transform-box: fill-box; transform-origin: center; animation: rouage 4s linear infinite; }
      @keyframes rouage { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .a1, .a2, .signal, .p1, .p2, .lueur { animation: none; opacity: 0; }
        .a3, .ct { animation: none; opacity: 1; transform: none; }
        .image { animation: none; opacity: 1; transform: translate(-268px, 76px); }
        .bouton, .rouage { animation: none; }
      }
    </style>
  </defs>

  <rect width="960" height="420" rx="18" fill="#0a0006"/>
  <rect width="960" height="6" fill="url(#ynov)"/>
  <text class="titre" x="32" y="52">La télécommande et le moteur</text>
  <text class="petit" x="32" y="78">qui fait vraiment le travail quand on tape une commande docker</text>
  <text class="etape a1" x="928" y="52" fill="#00eaff">1 · la télécommande envoie l'ordre</text>
  <text class="etape a2" x="928" y="52" fill="#859cff">2 · le moteur va chercher l'image</text>
  <text class="etape a3" x="928" y="52" fill="#5affb6">3 · les ouvriers fabriquent</text>

  <!-- Télécommande -->
  <rect class="boite" x="40" y="104" width="140" height="196" rx="22" stroke="#00eaff"/>
  <rect x="54" y="122" width="112" height="56" rx="8" fill="#0a0006" stroke="#00eaff" stroke-width="1.5"/>
  <text class="code" x="64" y="145">docker run</text>
  <text class="code" x="64" y="166">nginx</text>
  <circle class="bouton" cx="110" cy="214" r="18" stroke="#5affb6" stroke-width="2.5" fill="#1d1d1d"/>
  <g fill="#a0a4a0"><circle cx="78" cy="262" r="8"/><circle cx="110" cy="262" r="8"/><circle cx="142" cy="262" r="8"/></g>
  <text class="l18 m" x="110" y="328" fill="#00eaff">Client docker</text>
  <text class="petit m" x="110" y="350">la télécommande</text>

  <!-- Liaison client - moteur -->
  <path d="M182 214 H294" stroke="#a0a4a0" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#f)"/>
  <text class="petit m" x="238" y="202">docker.sock</text>
  <g fill="#00eaff">
    <circle class="signal" cx="188" cy="214" r="6"/>
    <circle class="signal" cx="188" cy="214" r="6" style="animation-delay:.25s"/>
    <circle class="signal" cx="188" cy="214" r="6" style="animation-delay:.5s"/>
  </g>

  <!-- Moteur -->
  <rect class="boite" x="300" y="130" width="260" height="170" rx="14" stroke="#eeff57"/>
  <rect class="lueur" x="300" y="130" width="260" height="170" rx="14" fill="#eeff57"/>
  <text class="l18" x="318" y="162" fill="#eeff57">Moteur (dockerd)</text>
  <text class="petit" x="318" y="184">tourne en permanence</text>
  <g class="rouage" fill="#eeff57">
    <circle cx="362" cy="252" r="22"/>
    <rect x="357" y="220" width="10" height="64" rx="2"/>
    <rect x="330" y="247" width="64" height="10" rx="2"/>
    <rect x="357" y="220" width="10" height="64" rx="2" transform="rotate(45 362 252)"/>
    <rect x="357" y="220" width="10" height="64" rx="2" transform="rotate(-45 362 252)"/>
    <circle cx="362" cy="252" r="9" fill="#1d1d1d"/>
  </g>

  <!-- Registre -->
  <rect class="boite" x="640" y="96" width="280" height="96" rx="14" stroke="#859cff"/>
  <text class="l18" x="656" y="124" fill="#859cff">Registre (Docker Hub)</text>
  <text class="petit" x="656" y="146">entrepôt d'images : n'exécute rien</text>
  <g fill="#859cff" fill-opacity=".6"><rect x="822" y="162" width="26" height="20" rx="3"/><rect x="854" y="162" width="26" height="20" rx="3"/><rect x="886" y="162" width="20" height="20" rx="3"/></g>
  <path class="a2" d="M690 186 C620 200 560 230 538 244" fill="none" stroke="#859cff" stroke-width="2" stroke-dasharray="5 5"/>
  <g class="image"><rect x="690" y="156" width="112" height="28" rx="6" fill="#00eaff"/><text x="746" y="175" class="m" font-size="15" font-weight="700" fill="#0a0006">image nginx</text></g>

  <!-- Ouvriers -->
  <g stroke="#a0a4a0" stroke-width="2"><path d="M560 237 H596" marker-end="url(#f)"/><path d="M752 237 H778" marker-end="url(#f)"/><path d="M850 262 V288" marker-end="url(#f)"/></g>
  <rect class="boite" x="600" y="214" width="152" height="46" rx="10" stroke="#5affb6"/>
  <text class="l18 m" x="676" y="243" fill="#5affb6">containerd</text>
  <rect class="boite" x="782" y="214" width="138" height="46" rx="10" stroke="#5affb6"/>
  <text class="l18 m" x="851" y="243" fill="#5affb6">runc</text>
  <circle class="p1" cx="560" cy="237" r="6" fill="#eeff57"/>
  <circle class="p2" cx="752" cy="237" r="6" fill="#eeff57"/>
  <text class="petit a1" x="600" y="318">ouvriers spécialisés :</text>
  <text class="petit a1" x="600" y="338">ils attendent le moteur</text>
  <text class="petit a2" x="600" y="318">ouvriers spécialisés :</text>
  <text class="petit a2" x="600" y="338">ils attendent le moteur</text>
  <g class="ct">
    <rect x="600" y="292" width="320" height="50" rx="12" fill="#1d1d1d" stroke="#5affb6" stroke-width="2.5"/>
    <circle cx="626" cy="317" r="8" fill="#5affb6"/>
    <text class="l18" x="644" y="324" fill="#eaf0eb">conteneur nginx : Up</text>
  </g>

  <!-- Légende -->
  <rect x="0" y="366" width="960" height="54" fill="#15101a"/>
  <text class="legende" x="32" y="400">La commande docker n'est qu'une télécommande : <tspan fill="#eeff57" font-weight="700">c'est le moteur qui travaille</tspan>.</text>
</svg>
