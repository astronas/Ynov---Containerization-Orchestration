<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">L'immeuble des conteneurs : murs, compteurs, badges et fondations partagées</title>
  <desc id="d">Trois appartements, trois conteneurs, posés sur les mêmes fondations : le noyau Linux. D'abord, l'occupant de A regarde vers le voisin : son regard s'arrête au mur, il ne voit que chez lui (les namespaces). Ensuite, le compteur de B grimpe jusqu'à la limite et son disjoncteur saute : seul B est coupé (les cgroups). Enfin, l'occupant de C présente son badge : il ouvre le port 80 mais ne peut pas régler l'heure de la machine (les capabilities).</desc>
  <defs>
    <linearGradient id="ynov" x1="0" x2="1">
      <stop offset="0" stop-color="#ff1a1a"/><stop offset=".13" stop-color="#ff84ef"/>
      <stop offset=".28" stop-color="#eeff57"/><stop offset=".47" stop-color="#5affb6"/>
      <stop offset=".62" stop-color="#00eaff"/><stop offset=".8" stop-color="#859cff"/>
      <stop offset=".89" stop-color="#4a8cff"/><stop offset="1" stop-color="#018e4d"/>
    </linearGradient>
    <g id="occupant" fill="#eaf0eb"><circle cx="0" cy="0" r="13"/><path d="M-22 40 q22 -44 44 0 z"/></g>
    <style>
      text { font-family: Bahnschrift, "Barlow Semi Condensed", "Segoe UI", Arial, sans-serif; }
      .titre { font-size: 26px; font-weight: 700; fill: #fff; }
      .label { font-size: 19px; font-weight: 700; }
      .l18 { font-size: 18px; font-weight: 700; }
      .petit { font-size: 15px; fill: #a0a4a0; }
      .evt { font-size: 15px; font-weight: 700; text-anchor: middle; }
      .legende { font-size: 19px; fill: #eaf0eb; }
      .etape { font-size: 18px; font-weight: 700; text-anchor: end; }
      .m { text-anchor: middle; }
      .boite { fill: #1d1d1d; stroke-width: 2.5; }
      /* 8 s : 1 murs (namespaces), 2 compteur (cgroups), 3 badge (capabilities) ; les états s'accumulent */
      .a1, .a2, .a3, .d1, .d2, .d3 { animation: 8s infinite both; opacity: 0; }
      .a1 { animation-name: a1; } .a2 { animation-name: a2; } .a3 { animation-name: a3; }
      .d1 { animation-name: d1; } .d2 { animation-name: d2; } .d3 { animation-name: d3; }
      @keyframes a1 { 0%, 31% { opacity: 1; } 34%, 100% { opacity: 0; } }
      @keyframes a2 { 0%, 31% { opacity: 0; } 34%, 64% { opacity: 1; } 67%, 100% { opacity: 0; } }
      @keyframes a3 { 0%, 64% { opacity: 0; } 67%, 97% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes d1 { 0%, 6% { opacity: 0; } 10%, 97% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes d2 { 0%, 50% { opacity: 0; } 53%, 97% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes d3 { 0%, 76% { opacity: 0; } 79%, 97% { opacity: 1; } 100% { opacity: 0; } }
      .regard { stroke-dasharray: 7 7; animation: regard 8s infinite both; }
      @keyframes regard { 0% { stroke-dashoffset: 84; opacity: 0; } 2% { opacity: 1; } 8%, 97% { stroke-dashoffset: 0; opacity: 1; } 100% { opacity: 0; } }
      .jauge { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(.35); }
      .jaugeB { animation: jaugeB 8s infinite both; }
      @keyframes jaugeB { 0%, 34% { transform: scaleY(.35); } 49% { transform: scaleY(1); } 97% { transform: scaleY(1); } 100% { transform: scaleY(.35); } }
      .rouge { animation: rouge 8s infinite both; opacity: 0; }
      @keyframes rouge { 0%, 46% { opacity: 0; } 48%, 97% { opacity: 1; } 100% { opacity: 0; } }
      .badge { animation: badge 8s infinite both; }
      @keyframes badge { 0%, 67% { transform: translate(0, 0); } 72%, 76% { transform: translate(14px, -10px); } 80%, 100% { transform: translate(0, 0); } }
      @media (prefers-reduced-motion: reduce) {
        .a1, .a2, .a3 { animation: none; opacity: 0; }
        .d1, .d2, .d3, .rouge { animation: none; opacity: 1; }
        .regard { animation: none; }
        .jaugeB { animation: none; transform: scaleY(1); }
        .badge { animation: none; }
      }
    </style>
  </defs>

  <rect width="960" height="420" rx="18" fill="#0a0006"/>
  <rect width="960" height="6" fill="url(#ynov)"/>
  <text class="titre" x="32" y="52">L'immeuble des conteneurs</text>
  <text class="petit" x="32" y="78">chacun chez soi, sur les mêmes fondations</text>
  <text class="etape a1" x="928" y="52" fill="#00eaff">1 · murs et volets : namespaces</text>
  <text class="etape a2" x="928" y="52" fill="#eeff57">2 · compteur : cgroups</text>
  <text class="etape a3" x="928" y="52" fill="#ff84ef">3 · badge : capabilities</text>

  <!-- Appartements -->
  <rect class="boite" x="72" y="100" width="220" height="180" rx="10" stroke="#a0a4a0"/>
  <rect class="boite" x="370" y="100" width="220" height="180" rx="10" stroke="#a0a4a0"/>
  <rect class="boite" x="668" y="100" width="220" height="180" rx="10" stroke="#a0a4a0"/>
  <rect class="a1" x="72" y="100" width="220" height="180" rx="10" fill="none" stroke="#00eaff" stroke-width="4"/>
  <rect class="a2" x="370" y="100" width="220" height="180" rx="10" fill="none" stroke="#eeff57" stroke-width="4"/>
  <rect class="a3" x="668" y="100" width="220" height="180" rx="10" fill="none" stroke="#ff84ef" stroke-width="4"/>
  <g class="l18" fill="#eaf0eb"><text x="88" y="128">Conteneur A</text><text x="386" y="128">Conteneur B</text><text x="684" y="128">Conteneur C</text></g>
  <use href="#occupant" x="122" y="176"/>
  <use href="#occupant" x="420" y="176"/>
  <use href="#occupant" x="718" y="176"/>
  <path class="regard" d="M136 172 H210" stroke="#00eaff" stroke-width="3"/>
  <!-- compteurs -->
  <g fill="none" stroke="#eeff57" stroke-width="2"><rect x="238" y="142" width="24" height="80" rx="4"/><rect x="536" y="142" width="24" height="80" rx="4"/><rect x="834" y="142" width="24" height="80" rx="4"/></g>
  <g fill="#eeff57">
    <rect class="jauge" x="241" y="145" width="18" height="74" rx="2"/>
    <rect class="jauge jaugeB" x="539" y="145" width="18" height="74" rx="2"/>
    <rect class="jauge" x="837" y="145" width="18" height="74" rx="2"/>
  </g>
  <rect class="rouge" x="539" y="145" width="18" height="74" rx="2" fill="#ff1a1a"/>
  <text class="petit m" x="250" y="128">compteur</text>
  <text class="petit m" x="548" y="128">compteur</text>
  <text class="petit m" x="846" y="128">compteur</text>

  <!-- 1 : le regard s'arrête au mur -->
  <g class="d1">
    <rect x="214" y="146" width="10" height="56" rx="3" fill="#00eaff"/><text class="petit m" x="200" y="228" style="fill:#00eaff">volet</text>
    <text class="evt" x="150" y="266" fill="#00eaff">ne voit que chez lui</text>
  </g>
  <!-- 2 : le disjoncteur de B saute -->
  <g class="d2">
    <rect x="372" y="102" width="216" height="176" rx="9" fill="#0a0006" fill-opacity=".6"/>
    <text class="evt" x="480" y="266" fill="#ff1a1a">disjoncté : chez lui seul</text>
  </g>
  <!-- 3 : le badge de C -->
  <g class="badge"><rect x="738" y="196" width="26" height="18" rx="3" fill="#ff84ef"/></g>
  <text class="evt d3" x="778" y="248" fill="#5affb6">port 80 : ouvert</text>
  <text class="evt d3" x="778" y="270" fill="#ff1a1a" style="animation-delay:.5s">régler l'heure : refusé</text>

  <!-- Fondations -->
  <rect x="52" y="292" width="856" height="54" rx="10" fill="#859cff" fill-opacity=".18" stroke="#859cff" stroke-width="2.5"/>
  <text class="l18 m" x="480" y="325" fill="#859cff">Fondations communes : le noyau Linux</text>

  <!-- Légende -->
  <rect x="0" y="366" width="960" height="54" fill="#15101a"/>
  <text class="legende" x="32" y="400">Chacun ses murs, son compteur, son badge ; tous partagent <tspan fill="#859cff" font-weight="700">le même noyau</tspan>.</text>
</svg>
