<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">La salle de concert : le cycle de vie d'un conteneur</title>
  <desc id="d">Une salle de concert est réservée pour un artiste : tant qu'il joue, la salle est ouverte, état Up. L'artiste termine et quitte la scène : la lumière s'éteint, le conteneur passe en Exited, mais le décor reste en place. Enfin on démonte tout avec docker rm : le décor puis la salle disparaissent, le conteneur est absent.</desc>
  <defs>
    <linearGradient id="ynov" x1="0" x2="1">
      <stop offset="0" stop-color="#ff1a1a"/><stop offset=".13" stop-color="#ff84ef"/>
      <stop offset=".28" stop-color="#eeff57"/><stop offset=".47" stop-color="#5affb6"/>
      <stop offset=".62" stop-color="#00eaff"/><stop offset=".8" stop-color="#859cff"/>
      <stop offset=".89" stop-color="#4a8cff"/><stop offset="1" stop-color="#018e4d"/>
    </linearGradient>
    <g id="note"><circle cx="0" cy="0" r="6"/><path d="M5 0 V-26 l11 7" fill="none" stroke-width="3" stroke-linecap="round"/></g>
    <g id="enceinte"><rect x="0" y="0" width="52" height="72" rx="6" fill="#1d1d1d" stroke="#859cff" stroke-width="2.5"/><circle cx="26" cy="22" r="9" fill="none" stroke="#859cff" stroke-width="2.5"/><circle cx="26" cy="50" r="14" fill="none" stroke="#859cff" stroke-width="2.5"/></g>
    <style>
      text { font-family: Bahnschrift, "Barlow Semi Condensed", "Segoe UI", Arial, sans-serif; }
      .titre { font-size: 26px; font-weight: 700; fill: #fff; }
      .label { font-size: 19px; font-weight: 700; }
      .l18 { font-size: 18px; font-weight: 700; }
      .petit { font-size: 15px; fill: #a0a4a0; }
      .code { font-size: 15px; fill: #a0a4a0; font-family: Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace; }
      .etat { font-size: 36px; font-weight: 700; text-anchor: middle; }
      .legende { font-size: 19px; fill: #eaf0eb; }
      .etape { font-size: 18px; font-weight: 700; text-anchor: end; }
      .m { text-anchor: middle; }
      .boite { fill: #1d1d1d; stroke-width: 2.5; }
      /* 8 s : 1 l'artiste joue (Up), 2 il a fini (Exited), 3 on démonte (docker rm) */
      .a1, .a2, .a3, .a23 { animation: 8s infinite both; opacity: 0; }
      .a1 { animation-name: a1; } .a2 { animation-name: a2; } .a3 { animation-name: a3; } .a23 { animation-name: a23; }
      @keyframes a1 { 0%, 31% { opacity: 1; } 34%, 100% { opacity: 0; } }
      @keyframes a2 { 0%, 31% { opacity: 0; } 34%, 64% { opacity: 1; } 67%, 100% { opacity: 0; } }
      @keyframes a3 { 0%, 64% { opacity: 0; } 67%, 97% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes a23 { 0%, 38% { opacity: 0; } 42%, 97% { opacity: 1; } 100% { opacity: 0; } }
      .artiste { animation: artiste 8s infinite both; }
      @keyframes artiste { 0%, 34% { opacity: 1; transform: translateX(0); } 44%, 100% { opacity: 0; transform: translateX(170px); } }
      .note { animation: note 1.6s infinite ease-out both; }
      @keyframes note { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-44px); } }
      .notes { animation: a1 8s infinite both; }
      .demonte { animation: demonte 8s infinite both; }
      @keyframes demonte { 0%, 68% { opacity: 1; transform: translateY(0); } 76%, 97% { opacity: 0; transform: translateY(-40px); } 100% { opacity: 0; transform: translateY(0); } }
      .salle { animation: salle 8s infinite both; }
      @keyframes salle { 0%, 78% { opacity: 1; } 86%, 97% { opacity: .18; } 100% { opacity: 1; } }
      .vide { animation: vide 8s infinite both; opacity: 0; }
      @keyframes vide { 0%, 84% { opacity: 0; } 88%, 97% { opacity: 1; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .a1, .a2, .notes, .artiste, .demonte { animation: none; opacity: 0; }
        .a3, .a23, .vide { animation: none; opacity: 1; }
        .salle { animation: none; opacity: .18; }
        .note { animation: none; }
      }
    </style>
  </defs>

  <rect width="960" height="420" rx="18" fill="#0a0006"/>
  <rect width="960" height="6" fill="url(#ynov)"/>
  <text class="titre" x="32" y="52">La salle de concert</text>
  <text class="petit" x="32" y="78">un conteneur vit tant que son artiste, le programme principal, joue</text>
  <text class="etape a1" x="928" y="52" fill="#5affb6">1 · l'artiste joue : Up</text>
  <text class="etape a2" x="928" y="52" fill="#eeff57">2 · il a fini : Exited</text>
  <text class="etape a3" x="928" y="52" fill="#ff1a1a">3 · on démonte : docker rm</text>

  <!-- La salle -->
  <g class="salle"><rect class="boite" x="40" y="100" width="600" height="244" rx="14" stroke="#a0a4a0"/></g>
  <polygon class="a1" points="340,104 252,272 428,272" fill="#eeff57" fill-opacity=".14"/>
  <g class="demonte" style="animation-delay:.3s">
    <rect x="226" y="118" width="228" height="36" rx="6" fill="#ff84ef"/>
    <text class="l18 m" x="340" y="142" fill="#0a0006">nginx en concert</text>
  </g>
  <g class="demonte"><use href="#enceinte" x="140" y="198"/></g>
  <g class="demonte" style="animation-delay:.15s"><use href="#enceinte" x="488" y="198"/></g>
  <g class="demonte" style="animation-delay:.45s"><rect x="120" y="272" width="440" height="26" rx="4" fill="#1f9e91"/></g>
  <!-- L'artiste -->
  <g class="artiste">
    <circle cx="340" cy="208" r="16" fill="#eaf0eb"/>
    <path d="M312 270 q28 -58 56 0 z" fill="#eaf0eb"/>
  </g>
  <g class="notes" fill="#eeff57" stroke="#eeff57">
    <use class="note" href="#note" x="384" y="206"/>
    <use class="note" href="#note" x="286" y="236" style="animation-delay:.6s"/>
    <use class="note" href="#note" x="404" y="236" style="animation-delay:1.1s"/>
  </g>
  <!-- Lumière éteinte -->
  <rect class="a23" x="42" y="102" width="596" height="240" rx="13" fill="#0a0006" fill-opacity=".5"/>
  <text class="petit a2" x="58" y="328" style="fill:#eeff57">fin du programme : le décor (ses fichiers) reste en place</text>
  <text class="petit a1" x="58" y="328">la salle = le conteneur ; le décor = ses fichiers</text>
  <text class="l18 m vide" x="340" y="226" fill="#a0a4a0">salle et décor supprimés</text>

  <!-- État affiché par docker ps -a -->
  <rect class="boite" x="680" y="100" width="248" height="244" rx="14" stroke="#a0a4a0"/>
  <text class="code m" x="804" y="132">docker ps -a</text>
  <path d="M700 146 H908" stroke="#a0a4a0" stroke-width="1"/>
  <g class="a1">
    <text class="etat" x="804" y="214" fill="#5affb6">Up</text>
    <text class="petit m" x="804" y="270">le programme principal</text>
    <text class="petit m" x="804" y="290">tourne</text>
  </g>
  <g class="a2">
    <text class="etat" x="804" y="214" fill="#eeff57">Exited (0)</text>
    <text class="petit m" x="804" y="270">programme terminé,</text>
    <text class="petit m" x="804" y="290">conteneur et fichiers là</text>
  </g>
  <g class="a3">
    <text class="etat" x="804" y="214" fill="#a0a4a0">(absent)</text>
    <text class="petit m" x="804" y="270">docker rm :</text>
    <text class="petit m" x="804" y="290">tout est supprimé</text>
  </g>

  <!-- Légende -->
  <rect x="0" y="366" width="960" height="54" fill="#15101a"/>
  <text class="legende" x="32" y="400">Le conteneur vit avec son programme principal ; <tspan fill="#eeff57" font-weight="700">ses fichiers restent jusqu'au rm</tspan>.</text>
</svg>
