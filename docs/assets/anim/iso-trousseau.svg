<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">Le trousseau de clés : ne garder que les capabilities utiles</title>
  <desc id="d">Le programme du conteneur tourne en administrateur, root, et reçoit par défaut un trousseau de 14 clés, les capabilities, sur une quarantaine possibles. On retire toutes les clés puis on ne rend que les deux dont il a besoin, SETUID et SETGID. Ensuite, la porte « changer d'utilisateur » s'ouvre, mais la porte « changer de propriétaire » reste fermée : sa clé, CHOWN, a été retirée.</desc>
  <defs>
    <linearGradient id="ynov" x1="0" x2="1">
      <stop offset="0" stop-color="#ff1a1a"/><stop offset=".13" stop-color="#ff84ef"/>
      <stop offset=".28" stop-color="#eeff57"/><stop offset=".47" stop-color="#5affb6"/>
      <stop offset=".62" stop-color="#00eaff"/><stop offset=".8" stop-color="#859cff"/>
      <stop offset=".89" stop-color="#4a8cff"/><stop offset="1" stop-color="#018e4d"/>
    </linearGradient>
    <g id="cle" fill="none" stroke-width="3.5" stroke-linecap="round"><circle cx="50" cy="0" r="8"/><path d="M58 0 H100 M90 0 V8 M98 0 V8"/></g>
    <style>
      text { font-family: Bahnschrift, "Barlow Semi Condensed", "Segoe UI", Arial, sans-serif; }
      .titre { font-size: 26px; font-weight: 700; fill: #fff; }
      .label { font-size: 19px; font-weight: 700; }
      .l18 { font-size: 18px; font-weight: 700; }
      .petit { font-size: 15px; fill: #a0a4a0; }
      .code { font-size: 15px; fill: #eaf0eb; font-family: Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace; }
      .legende { font-size: 19px; fill: #eaf0eb; }
      .etape { font-size: 18px; font-weight: 700; text-anchor: end; }
      .m { text-anchor: middle; }
      .boite { fill: #1d1d1d; stroke-width: 2.5; }
      /* 8 s : 1 root reçoit 14 clés, 2 on retire tout et on rend 2 clés, 3 les portes */
      .a1, .a2, .a3, .a23 { animation: 8s infinite both; opacity: 0; }
      .a1 { animation-name: a1; } .a2 { animation-name: a2; } .a3 { animation-name: a3; } .a23 { animation-name: a23; }
      @keyframes a1 { 0%, 31% { opacity: 1; } 34%, 100% { opacity: 0; } }
      @keyframes a2 { 0%, 31% { opacity: 0; } 34%, 64% { opacity: 1; } 67%, 100% { opacity: 0; } }
      @keyframes a3 { 0%, 64% { opacity: 0; } 67%, 97% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes a23 { 0%, 40% { opacity: 0; } 46%, 97% { opacity: 1; } 100% { opacity: 0; } }
      .tombe { animation: tombe 8s infinite both; }
      @keyframes tombe {
        0%, 35% { opacity: 1; transform: translateY(0); }
        46%, 97% { opacity: 0; transform: translateY(110px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .garde { animation: garde 8s infinite both; }
      @keyframes garde { 0%, 44% { stroke: #eeff57; } 48%, 97% { stroke: #5affb6; } 100% { stroke: #eeff57; } }
      .ouvre { transform-box: fill-box; transform-origin: 0 50%; animation: ouvre 8s infinite both; }
      @keyframes ouvre { 0%, 70% { transform: scaleX(1); } 76%, 97% { transform: scaleX(.18); } 100% { transform: scaleX(1); } }
      .o1 { animation: o1 8s infinite both; opacity: 0; }
      @keyframes o1 { 0%, 72% { opacity: 0; } 76%, 97% { opacity: 1; } 100% { opacity: 0; } }
      .o2 { animation: o2 8s infinite both; opacity: 0; }
      @keyframes o2 { 0%, 80% { opacity: 0; } 84%, 97% { opacity: 1; } 100% { opacity: 0; } }
      .avant { animation: avant 8s infinite both; }
      @keyframes avant { 0%, 70% { opacity: 1; } 73%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .a1, .a2, .tombe, .avant { animation: none; opacity: 0; }
        .a3, .a23, .o1, .o2 { animation: none; opacity: 1; }
        .garde { animation: none; stroke: #5affb6; }
        .ouvre { animation: none; transform: scaleX(.18); }
      }
    </style>
  </defs>

  <rect width="960" height="420" rx="18" fill="#0a0006"/>
  <rect width="960" height="6" fill="url(#ynov)"/>
  <text class="titre" x="32" y="52">Le trousseau de clés</text>
  <text class="petit" x="32" y="78">les capabilities : les pouvoirs de root, découpés en clés</text>
  <text class="etape a1" x="928" y="52" fill="#eeff57">1 · root reçoit un trousseau</text>
  <text class="etape a2" x="928" y="52" fill="#ff84ef">2 · on retire tout, on rend 2 clés</text>
  <text class="etape a3" x="928" y="52" fill="#5affb6">3 · seules les bonnes portes s'ouvrent</text>

  <!-- Le programme -->
  <text class="l18 m" x="110" y="140" fill="#eaf0eb">le programme</text>
  <circle cx="110" cy="182" r="18" fill="#eaf0eb"/>
  <path d="M78 240 q32 -56 64 0 z" fill="#eaf0eb"/>
  <rect x="74" y="254" width="72" height="30" rx="15" fill="#eeff57"/>
  <text class="l18 m" x="110" y="275" fill="#0a0006">root</text>
  <path d="M146 214 H246" stroke="#a0a4a0" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- Le trousseau -->
  <g stroke="#eeff57">
    <g class="tombe" style="animation-delay:0.00s"><g transform="rotate(40 360 215)"><use href="#cle" x="360" y="215"/></g></g>
    <g class="tombe" style="animation-delay:0.05s"><g transform="rotate(65 360 215)"><use href="#cle" x="360" y="215"/></g></g>
    <g class="tombe" style="animation-delay:0.10s"><g transform="rotate(91 360 215)"><use href="#cle" x="360" y="215"/></g></g>
    <g class="tombe" style="animation-delay:0.15s"><g transform="rotate(116 360 215)"><use href="#cle" x="360" y="215"/></g></g>
    <g class="tombe" style="animation-delay:0.20s"><g transform="rotate(142 360 215)"><use href="#cle" x="360" y="215"/></g></g>
    <g class="tombe" style="animation-delay:0.25s"><g transform="rotate(167 360 215)"><use href="#cle" x="360" y="215"/></g></g>
    <g class="tombe" style="animation-delay:0.30s"><g transform="rotate(193 360 215)"><use href="#cle" x="360" y="215"/></g></g>
    <g class="tombe" style="animation-delay:0.35s"><g transform="rotate(218 360 215)"><use href="#cle" x="360" y="215"/></g></g>
    <g class="tombe" style="animation-delay:0.40s"><g transform="rotate(244 360 215)"><use href="#cle" x="360" y="215"/></g></g>
    <g class="tombe" style="animation-delay:0.45s"><g transform="rotate(269 360 215)"><use href="#cle" x="360" y="215"/></g></g>
    <g class="tombe" style="animation-delay:0.50s"><g transform="rotate(295 360 215)"><use href="#cle" x="360" y="215"/></g></g>
    <g class="tombe" style="animation-delay:0.55s"><g transform="rotate(320 360 215)"><use href="#cle" x="360" y="215"/></g></g>
    <g class="garde"><g transform="rotate(-20 360 215)"><use href="#cle" x="360" y="215"/></g></g>
    <g class="garde"><g transform="rotate(20 360 215)"><use href="#cle" x="360" y="215"/></g></g>
  </g>
  <circle cx="360" cy="215" r="32" fill="none" stroke="#eaf0eb" stroke-width="4"/>
  <g class="a23 petit" style="fill:#5affb6;font-weight:700"><text x="464" y="176">SETUID</text><text x="464" y="268">SETGID</text></g>
  <text class="petit m a1" x="360" y="336" style="fill:#eeff57">14 clés par défaut (sur une quarantaine)</text>
  <text class="code m a2" x="360" y="336">--cap-drop ALL --cap-add SETUID --cap-add SETGID</text>
  <text class="petit m a3" x="360" y="336" style="fill:#5affb6">il ne garde que les 2 clés utiles</text>

  <!-- Les portes -->
  <rect x="600" y="104" width="62" height="100" rx="4" fill="#0a0006" stroke="#5affb6" stroke-width="2.5"/>
  <rect class="ouvre" x="603" y="107" width="56" height="94" rx="2" fill="#1d1d1d" stroke="#5affb6" stroke-width="1.5"/>
  <text class="l18" x="678" y="140" fill="#eaf0eb">changer d'utilisateur</text>
  <text class="petit avant" x="678" y="166">il faut la clé SETUID</text>
  <text class="petit o1" x="678" y="166" style="fill:#5affb6;font-weight:700">ouverte : clé gardée</text>

  <rect x="600" y="232" width="62" height="100" rx="4" fill="#0a0006" stroke="#ff1a1a" stroke-width="2.5"/>
  <rect x="603" y="235" width="56" height="94" rx="2" fill="#1d1d1d" stroke="#ff1a1a" stroke-width="1.5"/>
  <text class="l18" x="678" y="268" fill="#eaf0eb">changer de propriétaire</text>
  <text class="petit avant" x="678" y="294">il faut la clé CHOWN</text>
  <text class="petit o2" x="678" y="294" style="fill:#ff1a1a;font-weight:700">refusée : clé retirée</text>
  <text class="o2" x="616" y="294" font-size="30" font-weight="700" fill="#ff1a1a">✕</text>

  <!-- Légende -->
  <rect x="0" y="366" width="960" height="54" fill="#15101a"/>
  <text class="legende" x="32" y="400">Capabilities : on retire tout, on ne rend que <tspan fill="#5affb6" font-weight="700">les clés dont le programme a besoin</tspan>.</text>
</svg>
