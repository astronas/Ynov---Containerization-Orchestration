<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">Le compteur avec disjoncteur : un cgroup limite ce que consomme un conteneur</title>
  <desc id="d">Trois compteurs montent : la mémoire, le processeur et le nombre de programmes d'un conteneur, chacun avec une limite. Quand la mémoire dépasse sa limite, le disjoncteur saute : le conteneur est arrêté net, code de sortie 137. Le processeur bute sur sa limite et reste ralenti. Le compteur de programmes atteint 64 sur 64 et un nouveau programme est refusé.</desc>
  <defs>
    <linearGradient id="ynov" x1="0" x2="1">
      <stop offset="0" stop-color="#ff1a1a"/><stop offset=".13" stop-color="#ff84ef"/>
      <stop offset=".28" stop-color="#eeff57"/><stop offset=".47" stop-color="#5affb6"/>
      <stop offset=".62" stop-color="#00eaff"/><stop offset=".8" stop-color="#859cff"/>
      <stop offset=".89" stop-color="#4a8cff"/><stop offset="1" stop-color="#018e4d"/>
    </linearGradient>
    <style>
      text { font-family: Bahnschrift, "Barlow Semi Condensed", "Segoe UI", Arial, sans-serif; }
      .titre { font-size: 26px; font-weight: 700; fill: #fff; }
      .label { font-size: 19px; font-weight: 700; }
      .l18 { font-size: 18px; font-weight: 700; }
      .petit { font-size: 15px; fill: #a0a4a0; }
      .code { font-size: 15px; fill: #eaf0eb; font-family: Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace; }
      .legende { font-size: 19px; fill: #eaf0eb; }
      .etape { font-size: 18px; font-weight: 700; text-anchor: end; }
      .m { text-anchor: middle; }
      .boite { fill: #1d1d1d; stroke-width: 2.5; }
      /* 8 s : 1 le noyau compte, 2 la limite est atteinte, 3 trois sanctions */
      .a1, .a2, .a3, .d2, .avant { animation: 8s infinite both; opacity: 0; }
      .avant { animation-name: avant; }
      @keyframes avant { 0%, 48% { opacity: 1; } 51%, 100% { opacity: 0; } }
      .a1 { animation-name: a1; } .a2 { animation-name: a2; } .a3 { animation-name: a3; } .d2 { animation-name: d2; }
      @keyframes a1 { 0%, 31% { opacity: 1; } 34%, 100% { opacity: 0; } }
      @keyframes a2 { 0%, 31% { opacity: 0; } 34%, 64% { opacity: 1; } 67%, 100% { opacity: 0; } }
      @keyframes a3 { 0%, 64% { opacity: 0; } 67%, 97% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes d2 { 0%, 50% { opacity: 0; } 53%, 97% { opacity: 1; } 100% { opacity: 0; } }
      .niv { transform-box: fill-box; transform-origin: 50% 100%; animation: 8s infinite both; }
      .mem { animation-name: mem; } .cpu { animation-name: cpu; } .pid { animation-name: cpu; }
      @keyframes mem {
        0% { transform: scaleY(.15); fill: #00eaff; }
        30% { transform: scaleY(.62); fill: #00eaff; }
        43% { transform: scaleY(.8); fill: #00eaff; }
        47% { transform: scaleY(.93); fill: #ff1a1a; }
        50%, 97% { transform: scaleY(0); fill: #ff1a1a; }
        100% { transform: scaleY(.15); fill: #00eaff; }
      }
      @keyframes cpu {
        0% { transform: scaleY(.15); }
        30% { transform: scaleY(.62); }
        43%, 97% { transform: scaleY(.8); }
        100% { transform: scaleY(.15); }
      }
      .levier { animation: levier 8s infinite both; }
      @keyframes levier { 0%, 47% { transform: translateY(0); fill: #5affb6; } 50%, 97% { transform: translateY(26px); fill: #ff1a1a; } 100% { transform: translateY(0); fill: #5affb6; } }
      .refuse { animation: refuse 8s infinite both; opacity: 0; }
      @keyframes refuse {
        0%, 54% { opacity: 0; transform: translateY(-22px); }
        57% { opacity: 1; transform: translateY(-22px); }
        63% { opacity: 1; transform: translateY(0); }
        69% { opacity: 1; transform: translateY(-20px); }
        74%, 100% { opacity: 0; transform: translateY(-20px); }
      }
      .croix { animation: croix 8s infinite both; opacity: 0; }
      @keyframes croix { 0%, 62% { opacity: 0; } 64%, 97% { opacity: 1; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .a1, .a2, .refuse, .avant { animation: none; opacity: 0; }
        .a3, .d2, .croix { animation: none; opacity: 1; }
        .mem { animation: none; transform: scaleY(0); }
        .cpu, .pid { animation: none; transform: scaleY(.8); }
        .levier { animation: none; transform: translateY(26px); fill: #ff1a1a; }
      }
    </style>
  </defs>

  <rect width="960" height="420" rx="18" fill="#0a0006"/>
  <rect width="960" height="6" fill="url(#ynov)"/>
  <text class="titre" x="32" y="52">Le compteur avec disjoncteur</text>
  <text class="petit" x="32" y="78">un cgroup : le noyau compte, et coupe au-delà de la limite</text>
  <text class="etape a1" x="928" y="52" fill="#eaf0eb">1 · le noyau compte</text>
  <text class="etape a2" x="928" y="52" fill="#ff1a1a">2 · la limite est atteinte</text>
  <text class="etape a3" x="928" y="52" fill="#eeff57">3 · une sanction par ressource</text>

  <!-- En-têtes -->
  <text class="l18 m" x="180" y="118" fill="#00eaff">Mémoire</text>
  <text class="code m" x="180" y="140">--memory 256m</text>
  <text class="l18 m" x="480" y="118" fill="#5affb6">Processeur</text>
  <text class="code m" x="480" y="140">--cpus 0.5</text>
  <text class="l18 m" x="780" y="118" fill="#859cff">Programmes</text>
  <text class="code m" x="780" y="140">--pids-limit 64</text>

  <!-- Jauges -->
  <rect class="boite" x="144" y="156" width="72" height="144" rx="8" stroke="#00eaff"/>
  <rect class="boite" x="444" y="156" width="72" height="144" rx="8" stroke="#5affb6"/>
  <rect class="boite" x="744" y="156" width="72" height="144" rx="8" stroke="#859cff"/>
  <rect class="niv mem" x="148" y="160" width="64" height="136" rx="5" fill="#00eaff"/>
  <rect class="niv cpu" x="448" y="160" width="64" height="136" rx="5" fill="#5affb6"/>
  <rect class="niv pid" x="748" y="160" width="64" height="136" rx="5" fill="#859cff"/>
  <!-- Limites -->
  <g stroke="#ff1a1a" stroke-width="2.5" stroke-dasharray="7 5"><path d="M128 187 H232 M428 187 H532 M728 187 H832"/></g>
  <g class="petit" style="fill:#ff1a1a"><text x="238" y="192">limite</text><text x="538" y="192">limite</text><text x="838" y="192">limite</text></g>

  <!-- Disjoncteur de la mémoire -->
  <rect x="66" y="196" width="40" height="70" rx="8" fill="#1d1d1d" stroke="#eaf0eb" stroke-width="2"/>
  <rect class="levier" x="76" y="206" width="20" height="24" rx="4" fill="#5affb6"/>
  <text class="petit m" x="86" y="288">disjoncteur</text>

  <!-- Programmes : un nouveau est refusé -->
  <circle class="refuse" cx="780" cy="178" r="9" fill="#859cff"/>
  <text class="croix" x="818" y="172" font-size="26" font-weight="700" fill="#ff1a1a">✕</text>
  <text class="m avant" x="780" y="290" font-size="16" font-weight="700" fill="#0a0006">40</text>
  <text class="m d2" x="780" y="290" font-size="16" font-weight="700" fill="#0a0006">64/64</text>

  <!-- Sanctions -->
  <text class="petit m a1" x="480" y="334" style="fill:#eaf0eb">le noyau mesure en continu ce que consomme le conteneur</text>
  <text class="petit m a2" x="480" y="334" style="fill:#eaf0eb">limite atteinte : le noyau intervient</text>
  <g class="a3 l18 m">
    <text x="180" y="334" fill="#ff1a1a">arrêté net (code 137)</text>
    <text x="480" y="334" fill="#5affb6">ralenti, pas arrêté</text>
    <text x="780" y="334" fill="#859cff">plus de nouveaux</text>
  </g>

  <!-- Légende -->
  <rect x="0" y="366" width="960" height="54" fill="#15101a"/>
  <text class="legende" x="32" y="400">cgroup : le noyau <tspan fill="#eeff57" font-weight="700">compte</tspan> la consommation et <tspan fill="#ff1a1a" font-weight="700">coupe</tspan> au-delà de la limite fixée.</text>
</svg>
