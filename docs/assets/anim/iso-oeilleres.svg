<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">Les œillères du conteneur : un namespace filtre ce qu'il voit</title>
  <desc id="d">Sans œillères, le regard embrasse tous les programmes de la machine : sshd, cron, dockerd, mariadb, php-fpm et nginx, numéro 4312. Le noyau pose des œillères : le regard se rétrécit, le conteneur ne voit plus que son nginx, qui porte pour lui le numéro 1. Les autres programmes n'ont pas disparu : ils tournent toujours, cachés.</desc>
  <defs>
    <linearGradient id="ynov" x1="0" x2="1">
      <stop offset="0" stop-color="#ff1a1a"/><stop offset=".13" stop-color="#ff84ef"/>
      <stop offset=".28" stop-color="#eeff57"/><stop offset=".47" stop-color="#5affb6"/>
      <stop offset=".62" stop-color="#00eaff"/><stop offset=".8" stop-color="#859cff"/>
      <stop offset=".89" stop-color="#4a8cff"/><stop offset="1" stop-color="#018e4d"/>
    </linearGradient>
    <style>
      text { font-family: Bahnschrift, "Barlow Semi Condensed", "Segoe UI", Arial, sans-serif; }
      .titre { font-size: 26px; font-weight: 700; fill: #fff; }
      .label { font-size: 19px; font-weight: 700; }
      .l18 { font-size: 18px; font-weight: 700; }
      .petit { font-size: 15px; fill: #a0a4a0; }
      .proc { font-size: 17px; font-weight: 700; text-anchor: middle; fill: #eaf0eb; }
      .legende { font-size: 19px; fill: #eaf0eb; }
      .etape { font-size: 18px; font-weight: 700; text-anchor: end; }
      .m { text-anchor: middle; }
      .pil { fill: #1d1d1d; stroke: #a0a4a0; stroke-width: 1.5; }
      /* 8 s : 1 tout se voit, 2 les œillères se posent, 3 les autres tournent toujours */
      .a1, .a2, .a3, .a23 { animation: 8s infinite both; opacity: 0; }
      .a1 { animation-name: a1; } .a2 { animation-name: a2; } .a3 { animation-name: a3; } .a23 { animation-name: a23; }
      @keyframes a1 { 0%, 31% { opacity: 1; } 34%, 100% { opacity: 0; } }
      @keyframes a2 { 0%, 31% { opacity: 0; } 34%, 64% { opacity: 1; } 67%, 100% { opacity: 0; } }
      @keyframes a3 { 0%, 64% { opacity: 0; } 67%, 97% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes a23 { 0%, 34% { opacity: 0; } 42%, 97% { opacity: 1; } 100% { opacity: 0; } }
      .haut, .bas { animation: 8s infinite both; opacity: 0; }
      .haut { animation-name: haut; } .bas { animation-name: bas; }
      @keyframes haut { 0%, 33% { opacity: 0; transform: translateY(-50px); } 41%, 97% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }
      @keyframes bas { 0%, 33% { opacity: 0; transform: translateY(50px); } 41%, 97% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(50px); } }
      .vit { animation: vit 1.2s infinite alternate ease-in-out; }
      @keyframes vit { from { stroke-opacity: .5; } to { stroke-opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .a1, .a2 { animation: none; opacity: 0; }
        .a3, .a23, .haut, .bas { animation: none; opacity: 1; transform: none; }
        .vit { animation: none; }
      }
    </style>
  </defs>

  <rect width="960" height="420" rx="18" fill="#0a0006"/>
  <rect width="960" height="6" fill="url(#ynov)"/>
  <text class="titre" x="32" y="52">Les œillères du conteneur</text>
  <text class="petit" x="32" y="78">le namespace PID : ce que le noyau lui laisse voir</text>
  <text class="etape a1" x="928" y="52" fill="#eaf0eb">1 · sans œillères, tout se voit</text>
  <text class="etape a2" x="928" y="52" fill="#859cff">2 · le noyau pose les œillères</text>
  <text class="etape a3" x="928" y="52" fill="#eeff57">3 · les autres tournent toujours</text>

  <!-- Le conteneur qui regarde -->
  <text class="l18 m" x="140" y="150" fill="#00eaff">le conteneur</text>
  <path d="M96 220 Q140 182 184 220 Q140 258 96 220 Z" fill="#eaf0eb"/>
  <circle cx="146" cy="220" r="15" fill="#00eaff"/><circle cx="148" cy="220" r="7" fill="#0a0006"/>
  <rect class="haut" x="198" y="156" width="12" height="54" rx="4" fill="#859cff"/>
  <rect class="bas" x="198" y="230" width="12" height="54" rx="4" fill="#859cff"/>
  <text class="petit m a23" x="140" y="300" style="fill:#859cff">œillères</text>

  <!-- Champ de vision -->
  <polygon class="a1" points="190,220 262,104 262,336" fill="#00eaff" fill-opacity=".12"/>
  <rect x="262" y="100" width="666" height="240" rx="12" fill="none" stroke="#a0a4a0" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Les programmes de la machine -->
  <g>
    <rect class="pil" x="290" y="118" width="160" height="38" rx="19"/><text class="proc" x="370" y="143">sshd · 812</text>
    <rect class="pil" x="520" y="112" width="160" height="38" rx="19"/><text class="proc" x="600" y="137">cron · 655</text>
    <rect class="pil" x="742" y="126" width="168" height="38" rx="19"/><text class="proc" x="826" y="151">dockerd · 1043</text>
    <rect class="pil" x="290" y="250" width="168" height="38" rx="19"/><text class="proc" x="374" y="275">mariadb · 2210</text>
    <rect class="pil" x="742" y="250" width="168" height="38" rx="19"/><text class="proc" x="826" y="275">php-fpm · 3120</text>
  </g>

  <!-- Masque des œillères (trou autour de nginx) -->
  <path class="a23" fill="#0a0006" fill-opacity=".9" fill-rule="evenodd"
        d="M263 101 H927 V339 H263 Z M500 186 V254 H720 V186 Z"/>
  <polygon class="a23" points="212,220 518,198 518,242" fill="#00eaff" fill-opacity=".22"/>
  <!-- Les autres, toujours là -->
  <g class="a3" fill="none" stroke="#eeff57" stroke-width="2.5" stroke-dasharray="6 5">
    <rect class="vit" x="290" y="118" width="160" height="38" rx="19"/>
    <rect class="vit" x="520" y="112" width="160" height="38" rx="19"/>
    <rect class="vit" x="742" y="126" width="168" height="38" rx="19"/>
    <rect class="vit" x="290" y="250" width="168" height="38" rx="19"/>
    <rect class="vit" x="742" y="250" width="168" height="38" rx="19"/>
  </g>

  <!-- Le programme du conteneur -->
  <rect x="520" y="200" width="180" height="40" rx="20" fill="#1d1d1d" stroke="#00eaff" stroke-width="2.5"/>
  <text class="proc a1" x="610" y="226">nginx · 4312</text>
  <text class="proc a23" x="610" y="226" style="fill:#00eaff">nginx · PID 1</text>

  <!-- Commentaire du bas -->
  <text class="petit m a1" x="595" y="326">vue de l'hôte : tous les programmes</text>
  <text class="petit m a2" x="595" y="326" style="fill:#00eaff">vue du conteneur : lui seul, numéro 1</text>
  <text class="petit m a3" x="595" y="326" style="fill:#eeff57">cachés, mais toujours en marche</text>

  <!-- Légende -->
  <rect x="0" y="366" width="960" height="54" fill="#15101a"/>
  <text class="legende" x="32" y="400">Namespace : <tspan fill="#00eaff" font-weight="700">une vue filtrée</tspan>. Les autres programmes tournent toujours, cachés.</text>
</svg>
