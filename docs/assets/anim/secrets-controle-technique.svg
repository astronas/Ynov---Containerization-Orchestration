<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
<title id="t">Un audit de conformité vérifie une liste de points, pas la résistance à une vraie attaque</title>
<desc id="d">La configuration arrive au contrôle technique. Les points sont cochés un par un : trois OK, un WARN sur no-new-privileges, à trier, ici à traiter. Puis deux questions restent hors de la liste : conduis-tu bien, la voiture résiste-t-elle à un choc précis ? Pour cela, il faut un test d'intrusion.</desc>
<defs>
<linearGradient id="ynov" x1="0" x2="1">
<stop offset="0" stop-color="#ff1a1a"/><stop offset=".13" stop-color="#ff84ef"/>
<stop offset=".28" stop-color="#eeff57"/><stop offset=".47" stop-color="#5affb6"/>
<stop offset=".62" stop-color="#00eaff"/><stop offset=".8" stop-color="#859cff"/>
<stop offset=".89" stop-color="#4a8cff"/><stop offset="1" stop-color="#018e4d"/>
</linearGradient>

<style>
text{font-family:Bahnschrift,"Barlow Semi Condensed","Segoe UI",Arial,sans-serif}
.titre{font-size:26px;font-weight:700;fill:#fff}
.label{font-size:19px;font-weight:700}
.gros{font-size:24px;font-weight:700}
.petit{font-size:15px;fill:#a0a4a0}
.legende{font-size:19px;fill:#eaf0eb}
.boite{fill:#1d1d1d;stroke-width:2.5}
.mid{text-anchor:middle}.fin{text-anchor:end}.gras{font-weight:700}
.cy{fill:#00eaff}.mt{fill:#5affb6}.ja{fill:#eeff57}.ro{fill:#ff84ef}.la{fill:#859cff}.tq{fill:#1f9e91}.rg{fill:#ff1a1a}.bl{fill:#eaf0eb}.nr{fill:#0a0006}.gr{fill:#a0a4a0}
.s1,.s2,.s12{opacity:0}
.s1{animation:s1 9s infinite both}@keyframes s1{0%{opacity:0}4%,29%{opacity:1}33%,100%{opacity:0}}
.s2{animation:s2 9s infinite both}@keyframes s2{0%,31%{opacity:0}35%,59%{opacity:1}63%,100%{opacity:0}}
.s12{animation:s12 9s infinite both}@keyframes s12{0%{opacity:0}4%,59%{opacity:1}63%,100%{opacity:0}}
.a2{animation:a2 9s infinite both}@keyframes a2{0%,31%{opacity:0}35%,96%{opacity:1}100%{opacity:0}}
.a3{animation:a3 9s infinite both}@keyframes a3{0%,62%{opacity:0}66%,96%{opacity:1}100%{opacity:0}}

.voiture{animation:voiture 9s infinite both}
@keyframes voiture{0%{opacity:0;transform:translateX(-260px)}12%,96%{opacity:1;transform:none}100%{opacity:0;transform:none}}
.st{transform-box:fill-box;transform-origin:center;animation:st 9s infinite both}
@keyframes st{0%,14%{opacity:0;transform:scale(.5)}18%,96%{opacity:1;transform:none}100%{opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</defs>
<rect width="960" height="420" rx="18" fill="#0a0006"/>
<rect width="960" height="6" fill="url(#ynov)"/>
<text class="titre" x="32" y="52">L'audit, c'est le contrôle technique</text>
<text class="petit" x="32" y="78">Docker Bench vérifie une liste de points, un par un</text>
<g class="voiture"><path d="M50 262 v-26 q0 -10 10 -12 l44 -8 l34 -30 q6 -6 16 -6 h84 q10 0 16 8 l26 30 l30 6 q10 2 10 12 v26 z" fill="#1d1d1d" stroke="#00eaff" stroke-width="2.5"/><path d="M150 214 l22 -22 h40 v22 z M222 214 v-22 h20 l20 22 z" fill="#00eaff" fill-opacity=".25"/><circle cx="104" cy="262" r="18" fill="#0a0006" stroke="#a0a4a0" stroke-width="5"/><circle cx="262" cy="262" r="18" fill="#0a0006" stroke="#a0a4a0" stroke-width="5"/><text class="petit mid" x="180" y="310">ta configuration</text></g>
<rect class="boite" x="380" y="96" width="545" height="262" rx="14" stroke="#eeff57"/><text class="label ja" x="400" y="128">Points contrôlés (CIS Docker Benchmark)</text>
<text class="label bl" x="400" y="164" style="font-size:18px">Utilisateur non root</text>
<g class="st" style="animation-delay:0s"><rect x="836" y="144" width="70" height="26" rx="13" fill="#5affb6"/><text class="petit nr gras mid" x="871" y="163">OK</text></g>
<text class="label bl" x="400" y="196" style="font-size:18px">Limites de mémoire</text>
<g class="st" style="animation-delay:0.45s"><rect x="836" y="176" width="70" height="26" rx="13" fill="#5affb6"/><text class="petit nr gras mid" x="871" y="195">OK</text></g>
<text class="label bl" x="400" y="228" style="font-size:18px">no-new-privileges</text>
<g class="st" style="animation-delay:0.9s"><rect x="836" y="208" width="70" height="26" rx="13" fill="#eeff57"/><text class="petit nr gras mid" x="871" y="227">WARN</text></g>
<text class="label bl" x="400" y="260" style="font-size:18px">Ports sur 127.0.0.1</text>
<g class="st" style="animation-delay:1.35s"><rect x="836" y="240" width="70" height="26" rx="13" fill="#5affb6"/><text class="petit nr gras mid" x="871" y="259">OK</text></g>
<g class="a2"><rect x="392" y="208" width="524" height="32" rx="6" fill="#eeff57" fill-opacity=".14"/><text class="petit ja gras" x="600" y="228">à trier : ici, à traiter</text></g>
<g class="a3"><path d="M400 284 H906" stroke="#a0a4a0" stroke-dasharray="4 5"/><text class="label gr" x="400" y="312" style="font-size:18px">Tu conduis bien ?</text><rect x="806" y="294" width="100" height="26" rx="13" fill="#3a3a3a"/><text class="petit bl mid" x="856" y="313">non vérifié</text><text class="label gr" x="400" y="342" style="font-size:18px">Résiste à un choc précis ?</text><rect x="806" y="324" width="100" height="26" rx="13" fill="#3a3a3a"/><text class="petit bl mid" x="856" y="343">non vérifié</text><text class="petit mid" x="180" y="338">pour ça : test d'intrusion</text></g>
<rect x="0" y="366" width="960" height="54" fill="#15101a"/>
<text class="legende" x="32" y="400">Un audit coche une liste de règles ; il ne prouve pas qu'une vraie attaque échouera.</text>
</svg>
