<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
<title id="t">--read-only plastifie le système de fichiers ; seul le tableau blanc tmpfs reste inscriptible</title>
<desc id="d">Un reflet passe sur le système de fichiers du conteneur : il est plastifié. Un attaquant tente d'écrire dans /etc/nginx : refusé. Sur le tableau blanc, le tmpfs, nginx note son cache et ses fichiers temporaires, puis tout est effacé à l'arrêt.</desc>
<defs>
<linearGradient id="ynov" x1="0" x2="1">
<stop offset="0" stop-color="#ff1a1a"/><stop offset=".13" stop-color="#ff84ef"/>
<stop offset=".28" stop-color="#eeff57"/><stop offset=".47" stop-color="#5affb6"/>
<stop offset=".62" stop-color="#00eaff"/><stop offset=".8" stop-color="#859cff"/>
<stop offset=".89" stop-color="#4a8cff"/><stop offset="1" stop-color="#018e4d"/>
</linearGradient>

<style>
text{font-family:Bahnschrift,"Barlow Semi Condensed","Segoe UI",Arial,sans-serif}
.titre{font-size:26px;font-weight:700;fill:#fff}
.label{font-size:19px;font-weight:700}
.gros{font-size:24px;font-weight:700}
.petit{font-size:15px;fill:#a0a4a0}
.legende{font-size:19px;fill:#eaf0eb}
.boite{fill:#1d1d1d;stroke-width:2.5}
.mid{text-anchor:middle}.fin{text-anchor:end}.gras{font-weight:700}
.cy{fill:#00eaff}.mt{fill:#5affb6}.ja{fill:#eeff57}.ro{fill:#ff84ef}.la{fill:#859cff}.tq{fill:#1f9e91}.rg{fill:#ff1a1a}.bl{fill:#eaf0eb}.nr{fill:#0a0006}.gr{fill:#a0a4a0}
.s1,.s2,.s12{opacity:0}
.s1{animation:s1 9s infinite both}@keyframes s1{0%{opacity:0}4%,29%{opacity:1}33%,100%{opacity:0}}
.s2{animation:s2 9s infinite both}@keyframes s2{0%,31%{opacity:0}35%,59%{opacity:1}63%,100%{opacity:0}}
.s12{animation:s12 9s infinite both}@keyframes s12{0%{opacity:0}4%,59%{opacity:1}63%,100%{opacity:0}}
.a2{animation:a2 9s infinite both}@keyframes a2{0%,31%{opacity:0}35%,96%{opacity:1}100%{opacity:0}}
.a3{animation:a3 9s infinite both}@keyframes a3{0%,62%{opacity:0}66%,96%{opacity:1}100%{opacity:0}}

.reflet{animation:reflet 9s infinite both;opacity:0}
@keyframes reflet{0%,3%{opacity:1;transform:translateX(-120px)}24%{opacity:1;transform:translateX(420px)}26%,100%{opacity:0;transform:translateX(420px)}}
.badge{animation:badge 9s infinite both}
@keyframes badge{0%,18%{opacity:0}23%,96%{opacity:1}100%{opacity:0}}
.stylo{opacity:0;transform:translate(420px,140px);animation:stylo 9s infinite both}
@keyframes stylo{0%,30%{opacity:0;transform:translate(500px,110px)}33%{opacity:1;transform:translate(500px,110px)}42%{transform:translate(392px,162px)}45%{transform:translate(410px,152px)}48%{transform:translate(394px,161px)}52%,58%{opacity:1;transform:translate(420px,140px)}62%,100%{opacity:0;transform:translate(420px,140px)}}
.refus{opacity:0;animation:refus 9s infinite both}
@keyframes refus{0%,41%{opacity:0}44%,59%{opacity:1}63%,100%{opacity:0}}
.note{animation:note 9s infinite both}
@keyframes note{0%,62%{opacity:0}66%,86%{opacity:1}92%,100%{opacity:0}}
.gomme{opacity:0;animation:gomme 9s infinite both}
@keyframes gomme{0%,85%{opacity:0;transform:none}86%{opacity:1;transform:none}94%{opacity:1;transform:translateX(330px)}96%,100%{opacity:0;transform:translateX(330px)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</defs>
<rect width="960" height="420" rx="18" fill="#0a0006"/>
<rect width="960" height="6" fill="url(#ynov)"/>
<text class="titre" x="32" y="52">--read-only : un système de fichiers plastifié</text>
<text class="petit" x="32" y="78">on lit tout, on n'écrit que sur le tableau blanc (tmpfs)</text>
<clipPath id="cp"><rect x="56" y="106" width="368" height="238" rx="12"/></clipPath>
<rect class="boite" x="50" y="100" width="380" height="250" rx="14" stroke="#00eaff"/><text class="label cy" x="70" y="134">Système de fichiers</text>
<rect x="70" y="154" width="340" height="32" rx="6" fill="#262626"/><text class="label bl" x="86" y="177" style="font-size:18px">/etc/nginx</text>
<rect x="70" y="198" width="340" height="32" rx="6" fill="#262626"/><text class="label bl" x="86" y="221" style="font-size:18px">/usr</text>
<rect x="70" y="242" width="340" height="32" rx="6" fill="#262626"/><text class="label bl" x="86" y="265" style="font-size:18px">/var/www</text>
<rect x="70" y="286" width="340" height="32" rx="6" fill="#262626"/><text class="label bl" x="86" y="309" style="font-size:18px">/bin</text>
<g class="refus"><rect x="70" y="154" width="340" height="32" rx="6" fill="#ff1a1a" fill-opacity=".2" stroke="#ff1a1a" stroke-width="2.5"/><text class="label rg" x="230" y="177">refusé</text></g>
<rect x="56" y="106" width="368" height="238" rx="12" fill="#00eaff" fill-opacity=".06" stroke="#00eaff" stroke-width="1.5"/><g clip-path="url(#cp)"><g class="reflet"><path d="M60 100 h40 l-90 260 h-40 z" fill="#ffffff" fill-opacity=".18"/></g></g><g class="badge"><rect x="290" y="114" width="126" height="30" rx="15" fill="#00eaff"/><text class="petit nr gras mid" x="353" y="135">plastifié</text></g>
<g class="stylo"><g transform="rotate(-45)"><rect x="0" y="-6" width="58" height="12" rx="2" fill="#ff1a1a"/><path d="M0 -6 l-14 6 l14 6 z" fill="#ff84ef"/></g></g><g class="refus"><text class="petit rg gras" x="440" y="232">l'attaquant ne peut</text><text class="petit rg gras" x="440" y="252">rien modifier</text></g>
<g class="s1"><text class="petit cy gras" x="442" y="232">on lit tout,</text><text class="petit cy gras" x="442" y="252">on n'écrit rien</text></g>
<g class="a3"><text class="petit ja gras" x="442" y="232">nginx écrit</text><text class="petit ja gras" x="442" y="252">ici seulement</text><path d="M442 270 H566" stroke="#eeff57" stroke-width="2.5"/><path d="M566 264 l10 6 l-10 6 z" fill="#eeff57"/></g>
<text class="label ja" x="580" y="134">Tableau blanc : tmpfs</text><rect x="580" y="150" width="340" height="170" rx="10" fill="#eaf0eb"/><text class="petit" x="580" y="344">en mémoire, effacé à chaque arrêt</text>
<text class="note label nr" x="604" y="192" style="animation-delay:0s">cache de nginx</text>
<text class="note label nr" x="604" y="232" style="animation-delay:0.35s">nginx.pid</text>
<text class="note label nr" x="604" y="272" style="animation-delay:0.7s">fichiers temporaires</text>
<g class="gomme"><rect x="584" y="160" width="40" height="150" rx="8" fill="#ff84ef"/></g>
<rect x="0" y="366" width="960" height="54" fill="#15101a"/>
<text class="legende" x="32" y="400">--read-only : tout est figé, sauf le tableau blanc (tmpfs), effacé à chaque arrêt.</text>
</svg>
