<g class="retour"><use href="#k" x="60" y="196" stroke="#5affb6"/><use href="#k" x="96" y="196" stroke="#5affb6"/></g><g class="a3"><text class="label mt" x="122" y="214">SETUID + SETGID</text></g>
<g class="c1"><text class="gros bl" x="102" y="148">40 clés</text><text class="petit" x="102" y="172">root : une quarantaine</text></g>
<g class="c2"><text class="gros bl" x="102" y="148">14 clés</text><text class="petit" x="102" y="172">le défaut Docker</text></g>
<g class="c3"><text class="gros bl" x="102" y="148">0 clé</text><text class="petit" x="102" y="172">cap_drop: ALL</text></g>
<g class="a3"><text class="gros bl" x="102" y="148">2 clés</text><text class="petit" x="102" y="172">cap_add: SETUID, SETGID</text></g>
<use href="#perso" x="410" y="262" fill="#00eaff"/><text class="petit cy mid gras" x="410" y="306">Apache</text><rect class="boite" x="470" y="130" width="110" height="170" rx="6" stroke="#a0a4a0"/><circle cx="560" cy="218" r="5" fill="#a0a4a0"/><text class="petit bl mid" x="525" y="120">Passer en www-data</text><g class="s2"><rect x="470" y="130" width="110" height="170" rx="6" fill="#ff1a1a" fill-opacity=".15" stroke="#ff1a1a" stroke-width="2.5"/><use href="#cadenas" x="525" y="210" fill="#ff1a1a" stroke="#ff1a1a"/></g><g class="a3"><rect x="470" y="130" width="110" height="170" rx="6" fill="#5affb6" fill-opacity=".22" stroke="#5affb6" stroke-width="2.5"/><path d="M580 130 l26 14 v170 l-26 -14 z" fill="#1d1d1d" stroke="#5affb6" stroke-width="2"/></g>
<g class="s1"><text class="label bl" x="620" y="190">Docker retire déjà 26 clés</text><text class="petit" x="620" y="214">il en reste 14 : c'est encore beaucoup</text></g><g class="s2"><text class="label rg" x="620" y="190">Porte fermée</text><text class="petit" x="620" y="214">les workers restent root : lire l'erreur</text></g><g class="a3"><text class="label mt" x="620" y="190">Porte ouverte</text><text class="petit" x="620" y="214">workers en www-data, avec 2 clés</text></g>
<rect x="0" y="366" width="960" height="54" fill="#15101a"/>
<text class="legende" x="32" y="400">Tout retirer, voir quelle porte reste fermée, et ne rendre que cette clé-là.</text>
