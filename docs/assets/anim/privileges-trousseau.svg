<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
<title id="t">On retire toutes les clés du trousseau, puis on ne rend que les deux nécessaires</title>
<desc id="d">Le trousseau de root compte une quarantaine de clés ; Docker en retire 26 et en laisse 14. On les retire toutes (cap_drop: ALL) : la porte « passer en www-data » reste fermée, les workers d'Apache restent root. On ne rend que SETUID et SETGID : la porte s'ouvre, avec deux clés seulement.</desc>
<defs>
<linearGradient id="ynov" x1="0" x2="1">
<stop offset="0" stop-color="#ff1a1a"/><stop offset=".13" stop-color="#ff84ef"/>
<stop offset=".28" stop-color="#eeff57"/><stop offset=".47" stop-color="#5affb6"/>
<stop offset=".62" stop-color="#00eaff"/><stop offset=".8" stop-color="#859cff"/>
<stop offset=".89" stop-color="#4a8cff"/><stop offset="1" stop-color="#018e4d"/>
</linearGradient>
<g id="k" fill="none" stroke-width="2.5" stroke-linecap="round"><circle r="5"/><path d="M0 5 v19 M0 16 h5 M0 22 h4"/></g><g id="cadenas"><path d="M-6 -2 v-6 a6 6 0 0 1 12 0 v6" fill="none" stroke-width="3"/><rect x="-10" y="-3" width="20" height="16" rx="3" stroke="none"/></g><g id="perso"><circle cy="-20" r="12"/><path d="M-19 18 v-6 a19 17 0 0 1 38 0 v6 z"/></g>
<style>
text{font-family:Bahnschrift,"Barlow Semi Condensed","Segoe UI",Arial,sans-serif}
.titre{font-size:26px;font-weight:700;fill:#fff}
.label{font-size:19px;font-weight:700}
