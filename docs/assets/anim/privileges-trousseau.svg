.mid{text-anchor:middle}.fin{text-anchor:end}.gras{font-weight:700}
.cy{fill:#00eaff}.mt{fill:#5affb6}.ja{fill:#eeff57}.ro{fill:#ff84ef}.la{fill:#859cff}.tq{fill:#1f9e91}.rg{fill:#ff1a1a}.bl{fill:#eaf0eb}.nr{fill:#0a0006}.gr{fill:#a0a4a0}
.s1,.s2,.s12{opacity:0}
.s1{animation:s1 9s infinite both}@keyframes s1{0%{opacity:0}4%,29%{opacity:1}33%,100%{opacity:0}}
.s2{animation:s2 9s infinite both}@keyframes s2{0%,31%{opacity:0}35%,59%{opacity:1}63%,100%{opacity:0}}
.s12{animation:s12 9s infinite both}@keyframes s12{0%{opacity:0}4%,59%{opacity:1}63%,100%{opacity:0}}
.a2{animation:a2 9s infinite both}@keyframes a2{0%,31%{opacity:0}35%,96%{opacity:1}100%{opacity:0}}
.a3{animation:a3 9s infinite both}@keyframes a3{0%,62%{opacity:0}66%,96%{opacity:1}100%{opacity:0}}

.t1,.t2{opacity:0}
.t1{animation:t1 9s infinite both}
@keyframes t1{0%,11%{opacity:1;transform:none}15%,100%{opacity:0;transform:translateY(36px)}}
.t2{animation:t2 9s infinite both}
@keyframes t2{0%,32%{opacity:1;transform:none}38%,100%{opacity:0;transform:translateY(36px)}}
.c1{opacity:0;animation:c1 9s infinite both}@keyframes c1{0%,12%{opacity:1}13%,100%{opacity:0}}
.c2{opacity:0;animation:c2 9s infinite both}@keyframes c2{0%,12%{opacity:0}13%,32%{opacity:1}34%,100%{opacity:0}}
.c3{opacity:0;animation:c3 9s infinite both}@keyframes c3{0%,33%{opacity:0}35%,62%{opacity:1}64%,100%{opacity:0}}
.retour{transform-box:fill-box;transform-origin:center;animation:retour 9s infinite both}
@keyframes retour{0%,63%{opacity:0;transform:scale(.4)}68%{opacity:1;transform:scale(1.2)}71%,96%{opacity:1;transform:none}100%{opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</defs>
<rect width="960" height="420" rx="18" fill="#0a0006"/>
<rect width="960" height="6" fill="url(#ynov)"/>
<text class="titre" x="32" y="52">Le trousseau de root</text>
<text class="petit" x="32" y="78">une quarantaine de clés, les capabilities : Docker en laisse 14</text>
