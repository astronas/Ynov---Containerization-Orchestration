<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
<title id="t">Le passe-partout de root découpé en clés : chaque service ne garde que les siennes</title>
<desc id="d">Le passe-partout de root ouvre les quatre portes. Il est découpé en quatre clés séparées, une par pouvoir (SETUID, SETGID, SYS_ADMIN, DAC_OVERRIDE). Apache ne garde que les deux clés pour changer d'utilisateur et de groupe : ces deux portes s'ouvrent, les deux autres restent verrouillées, et no-new-privileges interdit toute promotion.</desc>
<defs>
<linearGradient id="ynov" x1="0" x2="1">
<stop offset="0" stop-color="#ff1a1a"/><stop offset=".13" stop-color="#ff84ef"/>
<stop offset=".28" stop-color="#eeff57"/><stop offset=".47" stop-color="#5affb6"/>
<stop offset=".62" stop-color="#00eaff"/><stop offset=".8" stop-color="#859cff"/>
<stop offset=".89" stop-color="#4a8cff"/><stop offset="1" stop-color="#018e4d"/>
</linearGradient>
<g id="cle" fill="none" stroke-width="3" stroke-linecap="round"><circle r="7"/><path d="M7 0 h20 M21 0 v7 M27 0 v6"/></g><g id="cadenas"><path d="M-6 -2 v-6 a6 6 0 0 1 12 0 v6" fill="none" stroke-width="3"/><rect x="-10" y="-3" width="20" height="16" rx="3" stroke="none"/></g><g id="perso"><circle cy="-20" r="12"/><path d="M-19 18 v-6 a19 17 0 0 1 38 0 v6 z"/></g>
<style>
text{font-family:Bahnschrift,"Barlow Semi Condensed","Segoe UI",Arial,sans-serif}
.titre{font-size:26px;font-weight:700;fill:#fff}
.label{font-size:19px;font-weight:700}
.gros{font-size:24px;font-weight:700}
.petit{font-size:15px;fill:#a0a4a0}
.legende{font-size:19px;fill:#eaf0eb}
.boite{fill:#1d1d1d;stroke-width:2.5}
.mid{text-anchor:middle}.fin{text-anchor:end}.gras{font-weight:700}
.cy{fill:#00eaff}.mt{fill:#5affb6}.ja{fill:#eeff57}.ro{fill:#ff84ef}.la{fill:#859cff}.tq{fill:#1f9e91}.rg{fill:#ff1a1a}.bl{fill:#eaf0eb}.nr{fill:#0a0006}.gr{fill:#a0a4a0}
.s1,.s2,.s12{opacity:0}
.s1{animation:s1 9s infinite both}@keyframes s1{0%{opacity:0}4%,29%{opacity:1}33%,100%{opacity:0}}
.s2{animation:s2 9s infinite both}@keyframes s2{0%,31%{opacity:0}35%,59%{opacity:1}63%,100%{opacity:0}}
.s12{animation:s12 9s infinite both}@keyframes s12{0%{opacity:0}4%,59%{opacity:1}63%,100%{opacity:0}}
.a2{animation:a2 9s infinite both}@keyframes a2{0%,31%{opacity:0}35%,96%{opacity:1}100%{opacity:0}}
.a3{animation:a3 9s infinite both}@keyframes a3{0%,62%{opacity:0}66%,96%{opacity:1}100%{opacity:0}}

.vole{animation:vole 9s infinite both}
@keyframes vole{0%,31%{opacity:0;transform:translate(-220px,-80px)}40%,96%{opacity:1;transform:none}100%{opacity:0;transform:none}}
.rend{opacity:.2;animation:rend 9s infinite both}
@keyframes rend{0%,62%{opacity:1}68%,100%{opacity:.2}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</defs>
<rect width="960" height="420" rx="18" fill="#0a0006"/>
<rect width="960" height="6" fill="url(#ynov)"/>
<text class="titre" x="32" y="52">Root, c'est le passe-partout du directeur</text>
<text class="petit" x="32" y="78">on le découpe en clés séparées : les capabilities</text>
<rect class="boite" x="390" y="112" width="100" height="126" rx="6" stroke="#a0a4a0"/><circle cx="470" cy="178" r="5" fill="#a0a4a0"/><g class="s1"><rect x="390" y="112" width="100" height="126" rx="6" fill="#5affb6" fill-opacity=".25" stroke="#5affb6" stroke-width="2.5"/></g><text class="petit bl mid" x="440" y="260">Changer d'UID</text>
<g class="vole"><use href="#cle" x="428" y="294" stroke="#eeff57"/><text class="petit la mid" x="440" y="330">SETUID</text></g>
<g class="a3"><rect x="390" y="112" width="100" height="126" rx="6" fill="#5affb6" fill-opacity=".25" stroke="#5affb6" stroke-width="2.5"/></g>
<rect class="boite" x="530" y="112" width="100" height="126" rx="6" stroke="#a0a4a0"/><circle cx="610" cy="178" r="5" fill="#a0a4a0"/><g class="s1"><rect x="530" y="112" width="100" height="126" rx="6" fill="#5affb6" fill-opacity=".25" stroke="#5affb6" stroke-width="2.5"/></g><text class="petit bl mid" x="580" y="260">Changer de GID</text>
<g class="vole"><use href="#cle" x="568" y="294" stroke="#eeff57"/><text class="petit la mid" x="580" y="330">SETGID</text></g>
<g class="a3"><rect x="530" y="112" width="100" height="126" rx="6" fill="#5affb6" fill-opacity=".25" stroke="#5affb6" stroke-width="2.5"/></g>
<rect class="boite" x="670" y="112" width="100" height="126" rx="6" stroke="#a0a4a0"/><circle cx="750" cy="178" r="5" fill="#a0a4a0"/><g class="s1"><rect x="670" y="112" width="100" height="126" rx="6" fill="#5affb6" fill-opacity=".25" stroke="#5affb6" stroke-width="2.5"/></g><text class="petit bl mid" x="720" y="260">Monter un disque</text>
<g class="vole"><g class="rend"><use href="#cle" x="708" y="294" stroke="#eeff57"/><text class="petit la mid" x="720" y="330">SYS_ADMIN</text></g></g>
<g class="a3"><use href="#cadenas" x="720" y="176" fill="#a0a4a0" stroke="#a0a4a0"/></g>
<rect class="boite" x="810" y="112" width="100" height="126" rx="6" stroke="#a0a4a0"/><circle cx="890" cy="178" r="5" fill="#a0a4a0"/><g class="s1"><rect x="810" y="112" width="100" height="126" rx="6" fill="#5affb6" fill-opacity=".25" stroke="#5affb6" stroke-width="2.5"/></g><text class="petit bl mid" x="860" y="260">Tout fichier</text>
<g class="vole"><g class="rend"><use href="#cle" x="848" y="294" stroke="#eeff57"/><text class="petit la mid" x="860" y="330">DAC_OVERRIDE</text></g></g>
<g class="a3"><use href="#cadenas" x="860" y="176" fill="#a0a4a0" stroke="#a0a4a0"/></g>
<g class="s1"><text class="label ja" x="40" y="140">root</text><text class="petit" x="40" y="164">le passe-partout du directeur</text><use href="#cle" transform="translate(80 214) scale(3)" stroke="#eeff57"/><text class="petit" x="40" y="276">il ouvre toutes les portes</text></g>
<g class="s2"><text class="label bl" x="40" y="140">Découpé en clés</text><text class="petit" x="40" y="164">une clé par pouvoir : les capabilities</text></g>
<g class="a3"><use href="#perso" x="76" y="214" fill="#5affb6"/><text class="label mt" x="116" y="200">Apache</text><text class="petit" x="116" y="222">ne garde que 2 clés</text><text class="label mt" x="40" y="294">no-new-privileges</text><text class="petit" x="40" y="316">pas de promotion</text><text class="petit" x="40" y="336">en cours de journée</text></g>
<rect x="0" y="366" width="960" height="54" fill="#15101a"/>
<text class="legende" x="32" y="400">Chaque service ne reçoit que les clés de son travail, sans promotion possible.</text>
</svg>
