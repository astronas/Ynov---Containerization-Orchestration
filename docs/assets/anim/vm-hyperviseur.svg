<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">L'hyperviseur fait croire à chaque VM qu'elle a son propre ordinateur</title>
  <desc id="d">Trois machines virtuelles affichent chacune leur processeur, leur mémoire, leur disque et leur carte réseau : chacune se croit seule. Le voile se lève : en coulisses, un hyperviseur simule ce matériel. Puis on voit l'unique vrai ordinateur, dont le processeur, la mémoire et le disque sont découpés en parts, une par VM.</desc>
  <defs>
    <linearGradient id="ynov" x1="0" x2="1">
      <stop offset="0" stop-color="#ff1a1a"/><stop offset=".13" stop-color="#ff84ef"/>
      <stop offset=".28" stop-color="#eeff57"/><stop offset=".47" stop-color="#5affb6"/>
      <stop offset=".62" stop-color="#00eaff"/><stop offset=".8" stop-color="#859cff"/>
      <stop offset=".89" stop-color="#4a8cff"/><stop offset="1" stop-color="#018e4d"/>
    </linearGradient>
    <style>
      text { font-family: Bahnschrift, "Barlow Semi Condensed", "Segoe UI", Arial, sans-serif; }
      .titre { font-size: 26px; font-weight: 700; fill: #fff; }
      .label { font-size: 19px; font-weight: 700; }
      .l18 { font-size: 18px; font-weight: 700; }
      .petit { font-size: 15px; fill: #a0a4a0; }
      .puce { font-size: 15px; text-anchor: middle; }
      .legende { font-size: 19px; fill: #eaf0eb; }
      .etape { font-size: 18px; font-weight: 700; text-anchor: end; }
      .m { text-anchor: middle; }
      .boite { fill: #1d1d1d; stroke-width: 2.5; }
      /* 8 s : 1 chaque VM se croit seule, 2 l'hyperviseur apparaît, 3 un seul matériel partagé */
      .a1, .a2, .a3, .a23 { animation: 8s infinite both; opacity: 0; }
      .a1 { animation-name: a1; } .a2 { animation-name: a2; } .a3 { animation-name: a3; } .a23 { animation-name: a23; }
      @keyframes a1 { 0%, 31% { opacity: 1; } 34%, 100% { opacity: 0; } }
      @keyframes a2 { 0%, 31% { opacity: 0; } 34%, 64% { opacity: 1; } 67%, 100% { opacity: 0; } }
      @keyframes a3 { 0%, 64% { opacity: 0; } 67%, 97% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes a23 { 0%, 31% { opacity: 0; } 36%, 97% { opacity: 1; } 100% { opacity: 0; } }
      .voile { animation: voile 8s infinite both; }
      @keyframes voile { 0%, 31% { opacity: 1; } 38%, 100% { opacity: 0; } }
      .part { transform-box: fill-box; transform-origin: 0 50%; animation: part 8s infinite both; }
      @keyframes part { 0%, 66% { transform: scaleX(0); } 74%, 97% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
      .flux { stroke-dasharray: 6 6; animation: flux .9s linear infinite; }
      @keyframes flux { to { stroke-dashoffset: -12; } }
      @media (prefers-reduced-motion: reduce) {
        .a1, .a2, .voile { animation: none; opacity: 0; }
        .a3, .a23 { animation: none; opacity: 1; }
        .part { animation: none; transform: none; }
        .flux { animation: none; }
      }
    </style>
  </defs>

  <rect width="960" height="420" rx="18" fill="#0a0006"/>
  <rect width="960" height="6" fill="url(#ynov)"/>
  <text class="titre" x="32" y="52">L'illusion de l'hyperviseur</text>
  <text class="petit" x="32" y="78">chaque machine virtuelle croit avoir son propre ordinateur</text>
  <text class="etape a1" x="928" y="52" fill="#eaf0eb">1 · chaque VM se croit seule</text>
  <text class="etape a2" x="928" y="52" fill="#859cff">2 · en coulisses, l'hyperviseur</text>
  <text class="etape a3" x="928" y="52" fill="#eeff57">3 · un seul matériel, partagé</text>

  <!-- Trois VM -->
  <g>
    <rect class="boite" x="32" y="96" width="280" height="110" rx="12" stroke="#00eaff"/>
    <text class="l18" x="48" y="124" fill="#00eaff">VM 1</text>
    <text class="petit" x="104" y="124">« mon ordinateur »</text>
    <g fill="none" stroke="#00eaff" stroke-width="1.5"><rect x="48" y="150" width="60" height="34" rx="6"/><rect x="112" y="150" width="60" height="34" rx="6"/><rect x="176" y="150" width="60" height="34" rx="6"/><rect x="240" y="150" width="60" height="34" rx="6"/></g>
    <g class="puce" fill="#00eaff"><text x="78" y="172">CPU</text><text x="142" y="172">RAM</text><text x="206" y="172">disque</text><text x="270" y="172">réseau</text></g>
  </g>
  <g>
    <rect class="boite" x="340" y="96" width="280" height="110" rx="12" stroke="#5affb6"/>
    <text class="l18" x="356" y="124" fill="#5affb6">VM 2</text>
    <text class="petit" x="412" y="124">« mon ordinateur »</text>
    <g fill="none" stroke="#5affb6" stroke-width="1.5"><rect x="356" y="150" width="60" height="34" rx="6"/><rect x="420" y="150" width="60" height="34" rx="6"/><rect x="484" y="150" width="60" height="34" rx="6"/><rect x="548" y="150" width="60" height="34" rx="6"/></g>
    <g class="puce" fill="#5affb6"><text x="386" y="172">CPU</text><text x="450" y="172">RAM</text><text x="514" y="172">disque</text><text x="578" y="172">réseau</text></g>
  </g>
  <g>
    <rect class="boite" x="648" y="96" width="280" height="110" rx="12" stroke="#ff84ef"/>
    <text class="l18" x="664" y="124" fill="#ff84ef">VM 3</text>
    <text class="petit" x="720" y="124">« mon ordinateur »</text>
    <g fill="none" stroke="#ff84ef" stroke-width="1.5"><rect x="664" y="150" width="60" height="34" rx="6"/><rect x="728" y="150" width="60" height="34" rx="6"/><rect x="792" y="150" width="60" height="34" rx="6"/><rect x="856" y="150" width="60" height="34" rx="6"/></g>
    <g class="puce" fill="#ff84ef"><text x="694" y="172">CPU</text><text x="758" y="172">RAM</text><text x="822" y="172">disque</text><text x="886" y="172">réseau</text></g>
  </g>

  <!-- Coulisses -->
  <g class="a23"><path class="flux" d="M172 206 V238 M480 206 V238 M788 206 V238" stroke="#859cff" stroke-width="2.5"/></g>
  <rect class="boite" x="32" y="238" width="896" height="44" rx="10" stroke="#859cff"/>
  <text class="l18" x="52" y="266" fill="#859cff">Hyperviseur</text>
  <text class="petit" x="170" y="266" style="fill:#eaf0eb">simule le matériel de chaque VM (KVM, Hyper-V, VirtualBox…)</text>
  <g class="a3"><path class="flux" d="M415 282 V306 M597 282 V306 M777 282 V306" stroke="#eeff57" stroke-width="2.5"/></g>
  <rect class="boite" x="32" y="304" width="896" height="46" rx="10" stroke="#eeff57"/>
  <text class="l18" x="52" y="333" fill="#eeff57">Un seul vrai ordinateur</text>
  <rect x="330" y="314" width="582" height="26" rx="6" fill="#0a0006" stroke="#a0a4a0" stroke-width="1"/>
  <g class="puce" fill="#0a0006">
    <g class="part"><rect x="332" y="316" width="166" height="22" rx="5" fill="#00eaff"/></g>
    <g class="part" style="animation-delay:.2s"><rect x="502" y="316" width="186" height="22" rx="5" fill="#5affb6"/></g>
    <g class="part" style="animation-delay:.4s"><rect x="692" y="316" width="166" height="22" rx="5" fill="#ff84ef"/></g>
    <g class="a3"><text x="415" y="332">part VM 1</text><text x="595" y="332">part VM 2</text><text x="775" y="332">part VM 3</text></g>
  </g>

  <!-- Voile de la phase 1 -->
  <g class="voile">
    <rect x="24" y="226" width="912" height="132" fill="#0a0006" fill-opacity=".92"/>
    <text class="l18 m" x="480" y="298" fill="#a0a4a0">en coulisses : invisible pour les VM</text>
  </g>

  <!-- Légende -->
  <rect x="0" y="366" width="960" height="54" fill="#15101a"/>
  <text class="legende" x="32" y="400">Chaque VM croit avoir son ordinateur ; en coulisses, <tspan fill="#eeff57" font-weight="700">un seul matériel</tspan> est partagé.</text>
</svg>
