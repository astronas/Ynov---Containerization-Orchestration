<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
<title id="t">Le Dockerfile est une recette, l'image un bocal scellé, le conteneur une assiette servie</title>
<desc id="d">docker build lit la recette ligne par ligne et remplit un bocal qui se ferme : l'image. docker run sert une première assiette à partir du bocal : un conteneur. Deux autres assiettes suivent, et le bocal reste plein.</desc>
<defs>
<linearGradient id="ynov" x1="0" x2="1">
<stop offset="0" stop-color="#ff1a1a"/><stop offset=".13" stop-color="#ff84ef"/>
<stop offset=".28" stop-color="#eeff57"/><stop offset=".47" stop-color="#5affb6"/>
<stop offset=".62" stop-color="#00eaff"/><stop offset=".8" stop-color="#859cff"/>
<stop offset=".89" stop-color="#4a8cff"/><stop offset="1" stop-color="#018e4d"/>
</linearGradient>
<marker id="fm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#5affb6"/></marker><marker id="fr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#ff84ef"/></marker>
<style>
text{font-family:Bahnschrift,"Barlow Semi Condensed","Segoe UI",Arial,sans-serif}
.titre{font-size:26px;font-weight:700;fill:#fff}
.label{font-size:19px;font-weight:700}
.txt{font-size:17px;fill:#eaf0eb}
.petit{font-size:15px;fill:#a0a4a0}
.etape{font-size:17px;fill:#eaf0eb}
.legende{font-size:19px;fill:#eaf0eb}
.a1,.a2,.a3,.f1,.f2,.f3,.p2,.p3,.e1,.e2,.e3,.h2,.h3{animation-duration:8s;animation-iteration-count:infinite;animation-fill-mode:both}
.a1{animation-name:a1}.a2{animation-name:a2}.a3{animation-name:a3}
.f1{animation-name:f1}.f2{animation-name:f2}.f3{animation-name:f3}
.p2,.p3{transform-box:fill-box;transform-origin:center}
.p2{animation-name:p2}.p3{animation-name:p3}
.e1{animation-name:e1}.e2{animation-name:e2}.e3{animation-name:e3}
.h2{animation-name:h2}.h3{animation-name:h3}
@keyframes a1{0%{opacity:0;transform:translateY(-24px)}6%,95%{opacity:1;transform:none}100%{opacity:0}}
@keyframes a2{0%,35%{opacity:0;transform:translateY(-24px)}41%,95%{opacity:1;transform:none}100%{opacity:0}}
@keyframes a3{0%,65%{opacity:0;transform:translateY(-24px)}71%,95%{opacity:1;transform:none}100%{opacity:0}}
@keyframes f1{0%{opacity:0}6%,95%{opacity:1}100%{opacity:0}}
@keyframes f2{0%,35%{opacity:0}41%,95%{opacity:1}100%{opacity:0}}
@keyframes f3{0%,65%{opacity:0}71%,95%{opacity:1}100%{opacity:0}}
@keyframes p2{0%,35%{opacity:0;transform:scale(.5)}40%{opacity:1;transform:scale(1.12)}44%,95%{opacity:1;transform:none}100%{opacity:0}}
@keyframes p3{0%,65%{opacity:0;transform:scale(.5)}70%{opacity:1;transform:scale(1.12)}74%,95%{opacity:1;transform:none}100%{opacity:0}}
@keyframes e1{0%{opacity:0}4%,31%{opacity:1}35%,100%{opacity:0}}
@keyframes e2{0%,35%{opacity:0}39%,61%{opacity:1}65%,100%{opacity:0}}
@keyframes e3{0%,65%{opacity:0}69%,95%{opacity:1}100%{opacity:0}}
@keyframes h2{0%,34%{opacity:1}39%,100%{opacity:0}}
@keyframes h3{0%,64%{opacity:1}69%,100%{opacity:0}}
.rm{display:none}

.remplir{transform-box:fill-box;transform-origin:center bottom;animation:remplir 8s infinite both}
@keyframes remplir{0%{transform:scaleY(0)}26%,95%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.couvercle{animation:couvercle 8s infinite both}
@keyframes couvercle{0%,24%{opacity:0;transform:translateY(-30px)}30%,95%{opacity:1;transform:none}100%{opacity:0}}

.lire{animation:lire 8s infinite both}
@keyframes lire{0%{opacity:0;transform:none}3%,10%{opacity:1;transform:none}14%,19%{opacity:1;transform:translateY(30px)}23%,29%{opacity:1;transform:translateY(60px)}33%,100%{opacity:0;transform:translateY(60px)}}
.srv1{animation:srv1 8s infinite both}
@keyframes srv1{0%,36%{opacity:0;transform:translateX(-170px)}46%,95%{opacity:1;transform:none}100%{opacity:0}}
.srv3{animation:srv3 8s infinite both}
@keyframes srv3{0%,64%{opacity:0;transform:translateX(-170px)}74%,95%{opacity:1;transform:none}100%{opacity:0}}

@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.a1,.a2,.a3,.f1,.f2,.f3,.p2,.p3{opacity:1;transform:none}
.e1,.e2,.e3,.h2,.h3{opacity:0}
.rm{display:inline}
.remplir,.couvercle,.srv1,.srv3{opacity:1;transform:none}.lire{opacity:0}}
</style>
</defs>
<rect width="960" height="420" rx="18" fill="#0a0006"/>
<rect width="960" height="6" fill="url(#ynov)"/>
<text class="titre" x="32" y="52">Recette, bocal, assiette</text>
<text class="etape e1" x="32" y="84"><tspan fill="#eeff57" font-weight="700">1.</tspan> docker build suit la recette et remplit un bocal scellé : l'image</text>
<text class="etape e2" x="32" y="84"><tspan fill="#eeff57" font-weight="700">2.</tspan> docker run sert une assiette à partir du bocal : un conteneur</text>
<text class="etape e3" x="32" y="84"><tspan fill="#eeff57" font-weight="700">3.</tspan> Autant d'assiettes qu'on veut : le bocal, lui, ne se vide jamais</text>
<text class="etape rm" x="32" y="84">Une recette, un bocal scellé, autant d'assiettes qu'on veut</text>

<rect x="32" y="110" width="200" height="220" rx="14" fill="#1d1d1d" stroke="#eeff57" stroke-width="2.5"/>
<text class="label" x="50" y="142" fill="#eeff57">Dockerfile</text>
<text class="petit" x="50" y="164">la recette</text>
<rect class="lire" x="42" y="186" width="180" height="26" rx="5" fill="#eeff57" fill-opacity=".2"/>
<text x="50" y="205" font-size="15" fill="#eaf0eb">FROM python</text>
<text x="50" y="235" font-size="15" fill="#eaf0eb">COPY app.py .</text>
<text x="50" y="265" font-size="15" fill="#eaf0eb">CMD python app.py</text>
<path d="M242 232 H360" stroke="#5affb6" stroke-width="3" marker-end="url(#fm)"/>
<text x="246" y="218" font-size="17" font-weight="700" fill="#5affb6">docker build</text>
<rect x="398" y="134" width="94" height="18" fill="#1d1d1d" stroke="#00eaff" stroke-width="2"/>
<rect x="380" y="150" width="130" height="180" rx="22" fill="#1d1d1d" stroke="#00eaff" stroke-width="2.5"/>
<rect class="remplir" x="390" y="166" width="110" height="154" rx="14" fill="#00eaff" fill-opacity=".3"/>
<rect class="couvercle" x="392" y="116" width="106" height="18" rx="5" fill="#5affb6"/>
<rect x="395" y="222" width="100" height="34" rx="6" fill="#0a0006" stroke="#00eaff" stroke-width="2"/><text class="label" x="445" y="245" text-anchor="middle" fill="#00eaff">image</text>
<g class="couvercle"><rect x="512" y="100" width="84" height="28" rx="7" fill="#5affb6" stroke="#5affb6" stroke-width="2"/><text x="554.0" y="119.4" text-anchor="middle" font-size="15" font-weight="700" fill="#0a0006">scellé</text></g>
<path d="M522 232 H628" stroke="#ff84ef" stroke-width="3" marker-end="url(#fr)"/>
<text x="530" y="218" font-size="17" font-weight="700" fill="#ff84ef">docker run</text>
<g class="srv1" style=""><ellipse cx="700" cy="150" rx="58" ry="18" fill="#1d1d1d" stroke="#ff84ef" stroke-width="2.5"/><ellipse cx="700" cy="148" rx="30" ry="8" fill="#00eaff" fill-opacity=".6"/><text class="label" x="774" y="157" fill="#ff84ef">conteneur 1</text></g>
<g class="srv3" style=""><ellipse cx="700" cy="235" rx="58" ry="18" fill="#1d1d1d" stroke="#ff84ef" stroke-width="2.5"/><ellipse cx="700" cy="233" rx="30" ry="8" fill="#00eaff" fill-opacity=".6"/><text class="label" x="774" y="242" fill="#ff84ef">conteneur 2</text></g>
<g class="srv3" style="animation-delay:.35s"><ellipse cx="700" cy="320" rx="58" ry="18" fill="#1d1d1d" stroke="#ff84ef" stroke-width="2.5"/><ellipse cx="700" cy="318" rx="30" ry="8" fill="#00eaff" fill-opacity=".6"/><text class="label" x="774" y="327" fill="#ff84ef">conteneur 3</text></g>
<text class="f3" x="445" y="354" text-anchor="middle" font-size="15" font-weight="700" fill="#5affb6">toujours plein</text>

<rect x="0" y="366" width="960" height="54" fill="#15101a"/>
<text class="legende" x="32" y="400">Dockerfile = la recette ; image = le bocal scellé ; conteneur = l'assiette servie.</text>
</svg>
