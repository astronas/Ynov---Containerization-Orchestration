<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
<title id="t">Un intérimaire manipulé ne peut abîmer que ce qu'on lui a confié</title>
<desc id="d">On remet à l'intérimaire, le conteneur, quatre choses : une seule clé, le code du coffre si besoin, une liste de collègues et un budget. Un escroc le manipule : la zone des dégâts possibles se limite à ce qu'on lui a confié. Le coffre principal, les autres pièces et les autres collègues restent verrouillés et intacts.</desc>
<defs>
<linearGradient id="ynov" x1="0" x2="1">
<stop offset="0" stop-color="#ff1a1a"/><stop offset=".13" stop-color="#ff84ef"/>
<stop offset=".28" stop-color="#eeff57"/><stop offset=".47" stop-color="#5affb6"/>
<stop offset=".62" stop-color="#00eaff"/><stop offset=".8" stop-color="#859cff"/>
<stop offset=".89" stop-color="#4a8cff"/><stop offset="1" stop-color="#018e4d"/>
</linearGradient>
<g id="perso"><circle cy="-20" r="12"/><path d="M-19 18 v-6 a19 17 0 0 1 38 0 v6 z"/></g><g id="cadenas"><path d="M-6 -2 v-6 a6 6 0 0 1 12 0 v6" fill="none" stroke-width="3"/><rect x="-10" y="-3" width="20" height="16" rx="3" stroke="none"/></g>
<style>
text{font-family:Bahnschrift,"Barlow Semi Condensed","Segoe UI",Arial,sans-serif}
.titre{font-size:26px;font-weight:700;fill:#fff}
.label{font-size:19px;font-weight:700}
.gros{font-size:24px;font-weight:700}
.petit{font-size:15px;fill:#a0a4a0}
.legende{font-size:19px;fill:#eaf0eb}
.boite{fill:#1d1d1d;stroke-width:2.5}
.mid{text-anchor:middle}.fin{text-anchor:end}.gras{font-weight:700}
.cy{fill:#00eaff}.mt{fill:#5affb6}.ja{fill:#eeff57}.ro{fill:#ff84ef}.la{fill:#859cff}.tq{fill:#1f9e91}.rg{fill:#ff1a1a}.bl{fill:#eaf0eb}.nr{fill:#0a0006}.gr{fill:#a0a4a0}
.s1,.s2,.s12{opacity:0}
.s1{animation:s1 9s infinite both}@keyframes s1{0%{opacity:0}4%,29%{opacity:1}33%,100%{opacity:0}}
.s2{animation:s2 9s infinite both}@keyframes s2{0%,31%{opacity:0}35%,59%{opacity:1}63%,100%{opacity:0}}
.s12{animation:s12 9s infinite both}@keyframes s12{0%{opacity:0}4%,59%{opacity:1}63%,100%{opacity:0}}
.a2{animation:a2 9s infinite both}@keyframes a2{0%,31%{opacity:0}35%,96%{opacity:1}100%{opacity:0}}
.a3{animation:a3 9s infinite both}@keyframes a3{0%,62%{opacity:0}66%,96%{opacity:1}100%{opacity:0}}

.item{animation:item 9s infinite both}
@keyframes item{0%{opacity:0;transform:translateX(-40px)}6%,96%{opacity:1;transform:none}100%{opacity:0;transform:none}}
.esc{animation:esc 9s infinite both}
@keyframes esc{0%,30%{opacity:0;transform:translateX(-60px)}36%,96%{opacity:1;transform:none}100%{opacity:0;transform:none}}
.zone{animation:zone 9s infinite both}
@keyframes zone{0%,40%{opacity:0}46%,96%{opacity:1}100%{opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</defs>
<rect width="960" height="420" rx="18" fill="#0a0006"/>
<rect width="960" height="6" fill="url(#ynov)"/>
<text class="titre" x="32" y="52">Le conteneur, un intérimaire</text>
<text class="petit" x="32" y="78">on ne lui confie que ce dont il a besoin pour travailler</text>
<g class="zone"><rect x="22" y="94" width="474" height="266" rx="16" fill="#ff1a1a" fill-opacity=".07" stroke="#ff1a1a" stroke-width="2" stroke-dasharray="8 6"/></g>
<use href="#perso" x="110" y="236" fill="#00eaff"/><text class="label cy mid" x="110" y="290">Intérimaire</text><text class="petit mid" x="110" y="310">ton conteneur</text>
<g class="item" style="animation-delay:0s"><rect class="boite" x="210" y="104" width="270" height="54" rx="10" stroke="#5affb6"/><text class="label bl" x="226" y="128">Une seule clé</text><text class="petit" x="226" y="148">un volume, en :ro si possible</text></g>
<g class="item" style="animation-delay:0.35s"><rect class="boite" x="210" y="168" width="270" height="54" rx="10" stroke="#5affb6"/><text class="label bl" x="226" y="192">Code du coffre</text><text class="petit" x="226" y="212">un secret, seulement si besoin</text></g>
<g class="item" style="animation-delay:0.7s"><rect class="boite" x="210" y="232" width="270" height="54" rx="10" stroke="#5affb6"/><text class="label bl" x="226" y="256">Liste de collègues</text><text class="petit" x="226" y="276">un réseau dédié</text></g>
<g class="item" style="animation-delay:1.05s"><rect class="boite" x="210" y="296" width="270" height="54" rx="10" stroke="#5affb6"/><text class="label bl" x="226" y="320">Un budget</text><text class="petit" x="226" y="340">limites CPU et mémoire</text></g>
<g class="esc"><rect x="36" y="106" width="130" height="34" rx="17" fill="#ff1a1a"/><text class="label bl mid" x="101" y="129">escroc</text><path d="M100 142 L108 186" stroke="#ff1a1a" stroke-width="3"/></g>
<rect class="boite" x="520" y="96" width="410" height="262" rx="14" stroke="#859cff"/><text class="label la" x="540" y="128">Le reste de la maison</text>
<rect x="540" y="144" width="370" height="52" rx="8" fill="#0a0006" stroke="#a0a4a0" stroke-width="1.5"/><use href="#cadenas" x="566" y="168" fill="#a0a4a0" stroke="#a0a4a0"/><text class="label bl" x="590" y="166">Coffre principal</text><text class="petit" x="590" y="186">mot de passe root de la base</text><g class="a3"><rect x="818" y="156" width="82" height="28" rx="14" fill="#5affb6"/><text class="petit nr gras mid" x="859" y="176">intact</text></g>
<rect x="540" y="206" width="370" height="52" rx="8" fill="#0a0006" stroke="#a0a4a0" stroke-width="1.5"/><use href="#cadenas" x="566" y="230" fill="#a0a4a0" stroke="#a0a4a0"/><text class="label bl" x="590" y="228">Autres pièces</text><text class="petit" x="590" y="248">fichiers de l'hôte</text><g class="a3"><rect x="818" y="218" width="82" height="28" rx="14" fill="#5affb6"/><text class="petit nr gras mid" x="859" y="238">intact</text></g>
<rect x="540" y="268" width="370" height="52" rx="8" fill="#0a0006" stroke="#a0a4a0" stroke-width="1.5"/><use href="#cadenas" x="566" y="292" fill="#a0a4a0" stroke="#a0a4a0"/><text class="label bl" x="590" y="290">Autres collègues</text><text class="petit" x="590" y="310">services hors de son réseau</text><g class="a3"><rect x="818" y="280" width="82" height="28" rx="14" fill="#5affb6"/><text class="petit nr gras mid" x="859" y="300">intact</text></g>
<g class="s2"><text class="petit rg gras" x="540" y="344">l'escroc ne peut toucher qu'à ce qu'on lui a confié</text></g>
<rect x="0" y="366" width="960" height="54" fill="#15101a"/>
<text class="legende" x="32" y="400">S'il se fait manipuler, les dégâts s'arrêtent à ce qu'on lui a confié.</text>
</svg>
