<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">Le panneau d'affichage et l'enveloppe cachetée : ConfigMap et Secret</title>
  <desc id="d">À gauche, la ConfigMap est un panneau que tout le monde lit. À droite, le Secret est une enveloppe cachetée : un passant ne l'ouvre pas. Une personne qui a le droit RBAC la prend et l'ouvre : on lit DB_PASS en base64, qui se décode aussitôt en « example ».</desc>
  <defs>
    <linearGradient id="ynov" x1="0" x2="1">
      <stop offset="0" stop-color="#ff1a1a"/><stop offset=".13" stop-color="#ff84ef"/>
      <stop offset=".28" stop-color="#eeff57"/><stop offset=".47" stop-color="#5affb6"/>
      <stop offset=".62" stop-color="#00eaff"/><stop offset=".8" stop-color="#859cff"/>
      <stop offset=".89" stop-color="#4a8cff"/><stop offset="1" stop-color="#018e4d"/>
    </linearGradient>
    <style>
      text { font-family: Bahnschrift, "Barlow Semi Condensed", "Segoe UI", Arial, sans-serif; }
      .titre { font-size: 26px; font-weight: 700; fill: #fff; }
      .label { font-size: 19px; font-weight: 700; }
      .l18 { font-size: 18px; font-weight: 700; }
      .petit { font-size: 16px; fill: #a0a4a0; }
      .legende { font-size: 19px; fill: #eaf0eb; }
      .pop { transform-box: fill-box; transform-origin: center; }
      /* Trois temps sur 9 s : A de 0 à 30 %, B de 33 à 62 %, C de 66 à 96 %. */
      .pa  { animation: pa 9s infinite both; }
      .pb  { animation: pb 9s infinite both; }
      .pc  { animation: pc 9s infinite both; }
      .pab { animation: pab 9s infinite both; }
      .pbc { animation: pbc 9s infinite both; }
      .popb { animation: popb 9s infinite both; }
      .popc { animation: popc 9s infinite both; }
      @keyframes pa  { 0%, 29% { opacity: 1; } 32%, 100% { opacity: 0; } }
      @keyframes pb  { 0%, 31% { opacity: 0; } 35%, 60% { opacity: 1; } 63%, 100% { opacity: 0; } }
      @keyframes pc  { 0%, 62% { opacity: 0; } 66%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
      @keyframes pab { 0%, 60% { opacity: 1; } 63%, 100% { opacity: 0; } }
      @keyframes pbc { 0%, 31% { opacity: 0; } 35%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
      @keyframes popb { 0%, 32% { opacity: 0; transform: scale(.5); } 36% { opacity: 1; transform: scale(1.1); } 39%, 95% { opacity: 1; transform: scale(1); } 99%, 100% { opacity: 0; transform: scale(1); } }
      @keyframes popc { 0%, 64% { opacity: 0; transform: scale(.5); } 68% { opacity: 1; transform: scale(1.1); } 71%, 95% { opacity: 1; transform: scale(1); } 99%, 100% { opacity: 0; transform: scale(1); } }
      .fourmis { stroke-dasharray: 6 6; animation: fourmis 1s linear infinite; }
      @keyframes fourmis { to { stroke-dashoffset: -12; } }
      .passant { animation: passant 9s infinite both; }
      @keyframes passant {
        0% { opacity: 0; transform: translate(0px, 0px); }
        3% { opacity: 1; transform: translate(0px, 0px); }
        27% { opacity: 1; transform: translate(360px, 0px); }
        30%, 100% { opacity: 0; transform: translate(360px, 0px); }
      }
      .ayantdroit { animation: ayantdroit 9s infinite both; }
      @keyframes ayantdroit {
        0%, 32% { opacity: 0; transform: translate(0px, 0px); }
        35% { opacity: 1; transform: translate(0px, 0px); }
        41%, 95% { opacity: 1; transform: translate(-40px, -8px); }
        99%, 100% { opacity: 0; transform: translate(-40px, -8px); }
      }
      .rabat { animation: rabat 9s infinite both; }
      @keyframes rabat { 0%, 41% { opacity: 1; } 45%, 96% { opacity: 0; } 100% { opacity: 1; } }
      .contenu { animation: contenu 9s infinite both; }
      @keyframes contenu { 0%, 43% { opacity: 0; } 47%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .pa, .pb, .pab { animation: none; opacity: 0; }
        .pc, .pbc, .popb, .popc { animation: none; opacity: 1; transform: none; }
        .fourmis { animation: none; }
        .passant { animation: none; opacity: 0; }
        .ayantdroit { animation: none; opacity: 1; transform: translate(-40px, -8px); }
        .rabat { animation: none; opacity: 0; }
        .contenu { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <rect width="960" height="420" rx="18" fill="#0a0006"/>
  <rect width="960" height="6" fill="url(#ynov)"/>
  <text class="titre" x="32" y="52">Panneau d'affichage et enveloppe cachetée</text>
  <text class="petit" x="32" y="80">ConfigMap : des réglages que tout le monde lit. Secret : des données sensibles, mises à part</text>

  <rect x="60" y="104" width="360" height="132" rx="14" fill="#1d1d1d" stroke="#eeff57" stroke-width="2.5"/>
  <text class="label" x="80" y="134" fill="#eeff57">ConfigMap</text>
  <text class="petit" x="196" y="134">le panneau du hall</text>
  <text class="l18" x="80" y="176" fill="#eaf0eb">DB_HOST = db</text>
  <text class="l18" x="80" y="210" fill="#eaf0eb">DB_USER = app</text>
  <path class="fourmis" d="M120 286 L120 238" stroke="#eeff57" stroke-width="2"/><circle cx="120" cy="300" r="13" fill="#a0a4a0"/><path class="fourmis" d="M220 286 L220 238" stroke="#eeff57" stroke-width="2"/><circle cx="220" cy="300" r="13" fill="#a0a4a0"/><path class="fourmis" d="M320 286 L320 238" stroke="#eeff57" stroke-width="2"/><circle cx="320" cy="300" r="13" fill="#a0a4a0"/>
  <text class="petit" x="110" y="340">tout le monde peut le lire</text>

  <text class="label" x="520" y="116" fill="#ff84ef">Secret</text>
  <text class="petit" x="590" y="116">l'enveloppe cachetée</text>
  <rect x="520" y="130" width="380" height="160" rx="10" fill="#1d1d1d" stroke="#ff84ef" stroke-width="2.5"/>
  <g class="contenu"><text class="l18" x="545" y="204" fill="#eaf0eb">DB_PASS = ZXhhbXBsZQ==</text></g>
  <g class="pc"><text class="l18" x="545" y="244" fill="#eeff57">décodé : « example »</text></g>
  <g class="rabat"><path d="M522 132 L710 216 L898 132" fill="#2a1027" stroke="#ff84ef" stroke-width="2.5" stroke-linejoin="round"/><circle cx="710" cy="214" r="18" fill="#ff84ef"/></g>

  <circle class="passant" cx="500" cy="318" r="13" fill="#a0a4a0"/>
  <g class="pa"><text class="petit" x="540" y="350">le passant ne l'ouvre pas</text></g>
  <circle class="ayantdroit" cx="920" cy="318" r="13" fill="#859cff"/>
  <g class="pb"><text class="petit" x="540" y="350" fill="#859cff" style="fill:#859cff">droit RBAC : lui peut l'ouvrir</text></g>
  <g class="pc"><text class="petit" x="540" y="350" fill="#ff1a1a" style="fill:#ff1a1a">base64 : un encodage, pas un coffre-fort</text></g>
  <rect x="0" y="366" width="960" height="54" fill="#15101a"/>
  <text class="legende" x="32" y="400">Un Secret évite la lecture <tspan fill="#ff84ef" font-weight="700">par accident</tspan>, pas la lecture par qui a le droit.</text>
</svg>
