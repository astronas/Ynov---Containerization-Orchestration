<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">Le guichet d'un rayon : l'API d'un service et son contrat</title>
  <desc id="d">Le rayon catalogue veut savoir ce qu'il reste en stock. Sa demande tente d'entrer par la porte de service de la réserve et elle est refusée. Elle passe alors par le guichet, selon les règles connues de tous, et revient avec la réponse : 12 en stock. Pendant ce temps, l'équipe de la réserve réorganise ses étagères sans que le guichet change.</desc>
  <defs>
    <linearGradient id="ynov" x1="0" x2="1">
      <stop offset="0" stop-color="#ff1a1a"/><stop offset=".13" stop-color="#ff84ef"/>
      <stop offset=".28" stop-color="#eeff57"/><stop offset=".47" stop-color="#5affb6"/>
      <stop offset=".62" stop-color="#00eaff"/><stop offset=".8" stop-color="#859cff"/>
      <stop offset=".89" stop-color="#4a8cff"/><stop offset="1" stop-color="#018e4d"/>
    </linearGradient>
    <style>
      text { font-family: Bahnschrift, "Barlow Semi Condensed", "Segoe UI", Arial, sans-serif; }
      .titre { font-size: 26px; font-weight: 700; fill: #fff; }
      .label { font-size: 19px; font-weight: 700; }
      .l18 { font-size: 18px; font-weight: 700; }
      .petit { font-size: 15px; fill: #a0a4a0; }
      .legende { font-size: 19px; fill: #eaf0eb; }
      .etape { font-size: 18px; font-weight: 700; text-anchor: end; }
      .m { text-anchor: middle; }
      .boite { fill: #1d1d1d; stroke-width: 2.5; }
      /* 8 s : 1 par derrière (refusé), 2 au guichet, 3 la réponse */
      .a1, .a2, .a3 { animation: 8s infinite both; opacity: 0; }
      .a1 { animation-name: a1; } .a2 { animation-name: a2; } .a3 { animation-name: a3; }
      @keyframes a1 { 0%, 31% { opacity: 1; } 34%, 100% { opacity: 0; } }
      @keyframes a2 { 0%, 31% { opacity: 0; } 34%, 64% { opacity: 1; } 67%, 100% { opacity: 0; } }
      @keyframes a3 { 0%, 64% { opacity: 0; } 67%, 97% { opacity: 1; } 100% { opacity: 0; } }
      .derriere { animation: derriere 8s infinite both; opacity: 0; }
      @keyframes derriere {
        0% { opacity: 0; transform: translateX(0); }
        4% { opacity: 1; transform: translateX(0); }
        16% { transform: translateX(150px); }
        19% { transform: translateX(132px); }
        22%, 30% { opacity: 1; transform: translateX(138px); }
        33%, 100% { opacity: 0; transform: translateX(138px); }
      }
      .refus { animation: refus 8s infinite both; opacity: 0; }
      @keyframes refus { 0%, 15% { opacity: 0; } 18%, 31% { opacity: 1; } 34%, 100% { opacity: 0; } }
      .demande { animation: demande 8s infinite both; opacity: 0; }
      @keyframes demande {
        0%, 34% { opacity: 0; transform: translateX(0); }
        37% { opacity: 1; transform: translateX(0); }
        52%, 62% { opacity: 1; transform: translateX(144px); }
        66%, 100% { opacity: 0; transform: translateX(144px); }
      }
      .reponse { animation: reponse 8s infinite both; opacity: 0; }
      @keyframes reponse {
        0%, 66% { opacity: 0; transform: translateX(0); }
        69% { opacity: 1; transform: translateX(0); }
        84%, 97% { opacity: 1; transform: translateX(-122px); }
        100% { opacity: 0; transform: translateX(-122px); }
      }
      .guichet { animation: guichet 8s infinite both; }
      @keyframes guichet { 0%, 50% { fill-opacity: .35; } 54%, 70% { fill-opacity: 1; } 76%, 100% { fill-opacity: .35; } }
      .etagere { animation: etagere 8s infinite both; }
      @keyframes etagere { 0%, 70% { transform: translateX(0); } 80%, 95% { transform: translateX(var(--d)); } 100% { transform: translateX(0); } }
      @media (prefers-reduced-motion: reduce) {
        .a1, .a2, .derriere, .refus, .demande { animation: none; opacity: 0; }
        .a3 { animation: none; opacity: 1; }
        .reponse { animation: none; opacity: 1; transform: translateX(-122px); }
        .guichet, .etagere { animation: none; }
      }
    </style>
  </defs>

  <rect width="960" height="420" rx="18" fill="#0a0006"/>
  <rect width="960" height="6" fill="url(#ynov)"/>
  <text class="titre" x="32" y="52">Le guichet du rayon</text>
  <text class="petit" x="32" y="78">l'API d'un service, et les règles pour s'en servir</text>
  <text class="etape a1" x="928" y="52" fill="#ff1a1a">1 · par derrière ? refusé</text>
  <text class="etape a2" x="928" y="52" fill="#eeff57">2 · on passe au guichet</text>
  <text class="etape a3" x="928" y="52" fill="#5affb6">3 · réponse selon le contrat</text>

  <!-- Rayon qui demande -->
  <rect class="boite" x="32" y="104" width="230" height="230" rx="14" stroke="#00eaff"/>
  <text class="label" x="52" y="136" fill="#00eaff">Rayon catalogue</text>
  <text class="petit" x="52" y="158">un service</text>
  <circle cx="110" cy="214" r="15" fill="#eaf0eb"/>
  <path d="M82 268 q28 -48 56 0 z" fill="#eaf0eb"/>
  <text class="petit" x="52" y="310">veut connaître le stock</text>

  <!-- Rayon qui répond -->
  <rect class="boite" x="520" y="104" width="408" height="230" rx="14" stroke="#859cff"/>
  <text class="label" x="660" y="136" fill="#859cff">Rayon réserve</text>
  <text class="petit" x="660" y="158">un autre service</text>
  <!-- Guichet -->
  <rect class="guichet" x="510" y="176" width="22" height="58" rx="4" fill="#5affb6"/>
  <text class="l18" x="548" y="202" fill="#5affb6">Guichet</text>
  <text class="petit" x="548" y="222">= l'API</text>
  <!-- Porte de service -->
  <rect x="512" y="266" width="18" height="52" rx="3" fill="#a0a4a0"/>
  <text class="petit" x="548" y="290">porte de</text>
  <text class="petit" x="548" y="308">service</text>
  <!-- Arrière-boutique -->
  <rect x="660" y="176" width="252" height="142" rx="10" fill="none" stroke="#859cff" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text class="petit" x="676" y="198">arrière-boutique</text>
  <g fill="#859cff">
    <rect class="etagere" x="680" y="214" width="96" height="14" rx="4" style="--d:110px"/>
    <rect class="etagere" x="796" y="214" width="96" height="14" rx="4" style="--d:-116px"/>
    <rect class="etagere" x="680" y="246" width="140" height="14" rx="4" style="--d:72px"/>
    <rect class="etagere" x="840" y="246" width="52" height="14" rx="4" style="--d:-160px"/>
  </g>
  <text class="petit a3" x="676" y="300" style="fill:#eaf0eb">dedans, on range autrement</text>
  <text class="petit a3" x="548" y="242" style="fill:#5affb6;font-weight:700">inchangé</text>
  <text class="petit a1" x="676" y="300" style="fill:#eaf0eb">on ne passe pas par ici</text>
  <text class="petit a2" x="676" y="300" style="fill:#eaf0eb">on ne passe pas par ici</text>

  <!-- Chemins -->
  <path d="M262 205 H508" stroke="#5affb6" stroke-width="2" stroke-dasharray="6 6" opacity=".5"/>
  <path d="M262 292 H508" stroke="#a0a4a0" stroke-width="2" stroke-dasharray="6 6" opacity=".4"/>
  <text class="petit a2" x="276" y="248" style="fill:#eeff57">règles connues de tous : le contrat</text>
  <text class="petit a3" x="276" y="248" style="fill:#eeff57">règles connues de tous : le contrat</text>

  <!-- Demande par derrière -->
  <g class="derriere"><rect x="272" y="276" width="96" height="32" rx="8" fill="#eeff57"/><text class="l18 m" x="320" y="298" fill="#0a0006">stock ?</text></g>
  <g class="refus"><text x="462" y="270" font-size="30" font-weight="700" fill="#ff1a1a">✕</text><text class="l18" x="300" y="262" fill="#ff1a1a">interdit</text></g>
  <!-- Demande au guichet -->
  <g class="demande"><rect x="272" y="189" width="96" height="32" rx="8" fill="#eeff57"/><text class="l18 m" x="320" y="211" fill="#0a0006">stock ?</text></g>
  <!-- Réponse -->
  <g class="reponse"><rect x="390" y="189" width="118" height="32" rx="8" fill="#5affb6"/><text class="l18 m" x="449" y="211" fill="#0a0006">12 en stock</text></g>

  <!-- Légende -->
  <rect x="0" y="366" width="960" height="54" fill="#15101a"/>
  <text class="legende" x="32" y="400">On passe toujours par le <tspan fill="#5affb6" font-weight="700">guichet (l'API)</tspan>, selon ses règles : le <tspan fill="#eeff57" font-weight="700">contrat</tspan>.</text>
</svg>
