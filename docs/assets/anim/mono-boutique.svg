<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">Petite boutique ou grand magasin : le monolithe et les microservices face à une panne</title>
  <desc id="d">À gauche, une seule personne conseille, encaisse et range la réserve : c'est le monolithe. À droite, un grand magasin a une équipe pour les rayons, une pour les caisses, une pour la réserve, reliées au talkie-walkie : ce sont les microservices. Une panne survient : la vendeuse tombe malade et toute la petite boutique ferme ; dans le grand magasin, seules les caisses tombent en panne : on flâne toujours dans les rayons, mais personne ne peut payer.</desc>
  <defs>
    <linearGradient id="ynov" x1="0" x2="1">
      <stop offset="0" stop-color="#ff1a1a"/><stop offset=".13" stop-color="#ff84ef"/>
      <stop offset=".28" stop-color="#eeff57"/><stop offset=".47" stop-color="#5affb6"/>
      <stop offset=".62" stop-color="#00eaff"/><stop offset=".8" stop-color="#859cff"/>
      <stop offset=".89" stop-color="#4a8cff"/><stop offset="1" stop-color="#018e4d"/>
    </linearGradient>
    <style>
      text { font-family: Bahnschrift, "Barlow Semi Condensed", "Segoe UI", Arial, sans-serif; }
      .titre { font-size: 26px; font-weight: 700; fill: #fff; }
      .label { font-size: 19px; font-weight: 700; }
      .l18 { font-size: 18px; font-weight: 700; }
      .petit { font-size: 15px; fill: #a0a4a0; }
      .legende { font-size: 19px; fill: #eaf0eb; }
      .etape { font-size: 18px; font-weight: 700; text-anchor: end; }
      .m { text-anchor: middle; }
      .boite { fill: #1d1d1d; stroke-width: 2.5; }
      /* 8 s : 1 tout fonctionne, 2 la panne, 3 les conséquences */
      .a1, .a2, .a3, .a23 { animation: 8s infinite both; opacity: 0; }
      .a1 { animation-name: a1; } .a2 { animation-name: a2; } .a3 { animation-name: a3; } .a23 { animation-name: a23; }
      @keyframes a1 { 0%, 31% { opacity: 1; } 34%, 100% { opacity: 0; } }
      @keyframes a2 { 0%, 31% { opacity: 0; } 34%, 64% { opacity: 1; } 67%, 100% { opacity: 0; } }
      @keyframes a3 { 0%, 64% { opacity: 0; } 67%, 97% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes a23 { 0%, 33% { opacity: 0; } 36%, 97% { opacity: 1; } 100% { opacity: 0; } }
      .va { animation: va 8s infinite both; opacity: 0; }
      @keyframes va {
        0%  { opacity: 0; transform: translateX(0); }
        4%  { opacity: 1; transform: translateX(0); }
        24% { opacity: 1; transform: translateX(114px); }
        30%, 100% { opacity: 0; transform: translateX(114px); }
      }
      .bloque { animation: bloque 8s infinite both; opacity: 0; }
      @keyframes bloque {
        0%, 66% { opacity: 0; transform: translateX(0); }
        70% { opacity: 1; transform: translateX(0); }
        80% { opacity: 1; transform: translateX(36px); }
        84% { transform: translateX(30px); }
        88%, 97% { opacity: 1; transform: translateX(36px); }
        100% { opacity: 0; transform: translateX(36px); }
      }
      .flane { animation: flane 1.6s infinite ease-in-out alternate; }
      @keyframes flane { from { transform: translateY(0); } to { transform: translateY(-5px); } }
      @media (prefers-reduced-motion: reduce) {
        .a1, .a2, .va { animation: none; opacity: 0; }
        .a3, .a23 { animation: none; opacity: 1; }
        .bloque { animation: none; opacity: 1; transform: translateX(36px); }
        .flane { animation: none; }
      }
    </style>
  </defs>

  <rect width="960" height="420" rx="18" fill="#0a0006"/>
  <rect width="960" height="6" fill="url(#ynov)"/>
  <text class="titre" x="32" y="52">Petite boutique ou grand magasin</text>
  <text class="petit" x="32" y="78">une personne fait tout, ou une équipe par service</text>
  <text class="etape a1" x="928" y="52" fill="#5affb6">1 · tout fonctionne</text>
  <text class="etape a2" x="928" y="52" fill="#ff1a1a">2 · une panne survient</text>
  <text class="etape a3" x="928" y="52" fill="#eeff57">3 · les conséquences</text>

  <!-- Petite boutique : le monolithe -->
  <rect class="boite" x="32" y="100" width="400" height="236" rx="14" stroke="#a0a4a0"/>
  <text class="label" x="52" y="132" fill="#eaf0eb">Petite boutique</text>
  <text class="petit" x="52" y="154">le monolithe : une seule personne</text>
  <circle cx="232" cy="194" r="16" fill="#eaf0eb"/>
  <path d="M202 252 q30 -50 60 0 z" fill="#eaf0eb"/>
  <g class="a23"><circle cx="232" cy="194" r="16" fill="#ff1a1a"/><text class="l18" x="264" y="200" fill="#ff1a1a">malade</text></g>
  <g class="l18 m">
    <rect x="52" y="274" width="112" height="38" rx="19" fill="none" stroke="#00eaff" stroke-width="2"/><text x="108" y="299" fill="#00eaff">conseille</text>
    <rect x="176" y="274" width="112" height="38" rx="19" fill="none" stroke="#ff84ef" stroke-width="2"/><text x="232" y="299" fill="#ff84ef">encaisse</text>
    <rect x="300" y="274" width="112" height="38" rx="19" fill="none" stroke="#859cff" stroke-width="2"/><text x="356" y="299" fill="#859cff">range</text>
  </g>
  <g class="a3">
    <rect x="34" y="102" width="396" height="232" rx="13" fill="#0a0006" fill-opacity=".86"/>
    <rect x="132" y="176" width="200" height="56" rx="8" fill="#0a0006" stroke="#ff1a1a" stroke-width="3"/>
    <text x="232" y="218" class="m" font-size="38" font-weight="700" fill="#ff1a1a">FERMÉ</text>
    <text x="232" y="266" class="l18 m" fill="#eaf0eb">toute la boutique s'arrête</text>
  </g>

  <!-- Grand magasin : les microservices -->
  <rect class="boite" x="500" y="100" width="428" height="236" rx="14" stroke="#a0a4a0"/>
  <text class="label" x="520" y="132" fill="#eaf0eb">Grand magasin</text>
  <text class="petit" x="520" y="154">les microservices : une équipe par service</text>
  <rect class="boite" x="516" y="172" width="112" height="88" rx="10" stroke="#00eaff"/>
  <text class="l18 m" x="572" y="200" fill="#00eaff">Rayons</text>
  <rect class="boite" x="660" y="172" width="120" height="88" rx="10" stroke="#ff84ef"/>
  <text class="l18 m" x="720" y="200" fill="#ff84ef">Caisses</text>
  <rect class="boite" x="812" y="172" width="100" height="88" rx="10" stroke="#859cff"/>
  <text class="l18 m" x="862" y="200" fill="#859cff">Réserve</text>
  <path d="M630 216 h28 M782 216 h28" stroke="#eaf0eb" stroke-width="2.5" stroke-dasharray="4 4"/>
  <text class="petit m" x="714" y="322">reliées au talkie-walkie (le réseau)</text>
  <g fill="#eeff57">
    <circle class="flane" cx="540" cy="240" r="7"/>
    <circle class="flane" cx="566" cy="240" r="7" style="animation-delay:.5s"/>
    <circle class="va" cx="606" cy="240" r="7"/>
    <circle class="bloque" cx="606" cy="240" r="7"/>
  </g>
  <g class="a23">
    <rect x="660" y="172" width="120" height="88" rx="10" fill="#ff1a1a" fill-opacity=".14" stroke="#ff1a1a" stroke-width="3"/>
    <text class="petit m" x="720" y="226" style="fill:#ff1a1a;font-weight:700">en panne</text>
  </g>
  <g class="a3 petit m" style="font-weight:700">
    <text x="572" y="290" style="fill:#5affb6">on flâne encore</text>
    <text x="720" y="290" style="fill:#ff1a1a">personne ne paie</text>
    <text x="862" y="290" style="fill:#a0a4a0">intacte</text>
  </g>

  <!-- Légende -->
  <rect x="0" y="366" width="960" height="54" fill="#15101a"/>
  <text class="legende" x="32" y="400">Monolithe : une panne ferme tout. Microservices : <tspan fill="#ff84ef" font-weight="700">seul le service touché</tspan> s'arrête.</text>
</svg>
