<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">Le plan de salle : Compose compare le plan et la salle, et ne touche qu'aux écarts</title>
  <desc id="d">Le plan (compose.yaml) demande web en version 2, db, le réseau backend et le volume db_data. Dans la salle, web est encore en version 1 et le réseau manque. Le traiteur compare ligne à ligne : web diffère, le réseau manque, db et le volume sont conformes. Il recrée web, crée le réseau et ne touche pas au reste.</desc>
  <defs>
    <linearGradient id="ynov" x1="0" x2="1">
      <stop offset="0" stop-color="#ff1a1a"/><stop offset=".13" stop-color="#ff84ef"/>
      <stop offset=".28" stop-color="#eeff57"/><stop offset=".47" stop-color="#5affb6"/>
      <stop offset=".62" stop-color="#00eaff"/><stop offset=".8" stop-color="#859cff"/>
      <stop offset=".89" stop-color="#4a8cff"/><stop offset="1" stop-color="#018e4d"/>
    </linearGradient>
    <style>
      text { font-family: Bahnschrift, "Barlow Semi Condensed", "Segoe UI", Arial, sans-serif; }
      .titre { font-size: 26px; font-weight: 700; fill: #fff; }
      .label { font-size: 19px; font-weight: 700; }
      .petit { font-size: 15px; fill: #a0a4a0; }
      .legende { font-size: 19px; fill: #eaf0eb; }
      .boite { fill: #1d1d1d; stroke-width: 2.5; }
      .case { fill: #1d1d1d; stroke-width: 2; }
      /* 9 s : 1) le plan change, 2) le traiteur compare, 3) il installe l'écart et laisse le reste. */
      .s1 { animation: s1 9s infinite both; opacity: 0; }
      .s3 { animation: s3 9s infinite both; opacity: 0; }
      .avant3 { animation: avant3 9s infinite both; }
      @keyframes s1 { 0% { opacity: 0; } 3%, 28% { opacity: 1; } 31%, 100% { opacity: 0; } }
      @keyframes s3 { 0%, 63% { opacity: 0; } 67%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes avant3 { 0%, 63% { opacity: 1; } 67%, 96% { opacity: 0; } 100% { opacity: 1; } }
      .b1, .b2, .b3, .b4 { opacity: 0; animation: 9s infinite both; }
      .b1 { animation-name: b1; } .b2 { animation-name: b2; } .b3 { animation-name: b3; } .b4 { animation-name: b4; }
      @keyframes b1 { 0%, 34% { opacity: 0; } 37%, 61% { opacity: 1; } 64%, 100% { opacity: 0; } }
      @keyframes b2 { 0%, 41% { opacity: 0; } 44%, 61% { opacity: 1; } 64%, 100% { opacity: 0; } }
      @keyframes b3 { 0%, 48% { opacity: 0; } 51%, 61% { opacity: 1; } 64%, 100% { opacity: 0; } }
      @keyframes b4 { 0%, 55% { opacity: 0; } 58%, 61% { opacity: 1; } 64%, 100% { opacity: 0; } }
      .scan { animation: scan 9s infinite both; opacity: 0; }
      @keyframes scan {
        0%, 32% { opacity: 0; transform: translate(0, 0); }
        34% { opacity: 1; transform: translate(0, 0); }
        56% { opacity: 1; transform: translate(0, 162px); }
        60%, 100% { opacity: 0; transform: translate(0, 162px); }
      }
      .neuf { animation: neuf 9s infinite both; opacity: 0; transform-box: fill-box; transform-origin: center; }
      @keyframes neuf { 0%, 64% { opacity: 0; transform: scale(.6); } 69% { opacity: 1; transform: scale(1.08); } 72%, 93% { opacity: 1; transform: scale(1); } 97%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .s1, .avant3, .b1, .b2, .b3, .b4, .scan { animation: none; opacity: 0; }
        .s3, .neuf { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <rect width="960" height="420" rx="18" fill="#0a0006"/>
  <rect width="960" height="6" fill="url(#ynov)"/>
  <text class="titre" x="32" y="50">Le plan de salle</text>
  <text class="petit" x="32" y="76">le plan = compose.yaml · le traiteur = docker compose up -d · la salle = l'hôte</text>

  <!-- Plan -->
  <rect class="boite" x="32" y="96" width="290" height="256" rx="14" stroke="#eeff57"/>
  <text class="label" x="52" y="124" fill="#eeff57">Plan</text>
  <text class="label" x="52" y="163" fill="#00eaff">web</text><text class="petit" x="136" y="163">image v2</text>
  <text class="label" x="52" y="217" fill="#5affb6">db</text><text class="petit" x="136" y="217">mariadb:11.4</text>
  <text class="label" x="52" y="271" fill="#859cff">réseau</text><text class="petit" x="136" y="271">backend</text>
  <text class="label" x="52" y="325" fill="#ff84ef">volume</text><text class="petit" x="136" y="325">db_data</text>
  <g class="s1"><rect x="130" y="144" width="86" height="28" rx="6" fill="none" stroke="#eeff57" stroke-width="2.5"/><text class="petit" x="226" y="163" style="fill:#eeff57">✎ modifié</text></g>

  <path d="M326 224 H352" stroke="#eeff57" stroke-width="3"/>
  <path d="M348 216 L360 224 L348 232z" fill="#eeff57"/>

  <!-- Salle -->
  <rect class="boite" x="364" y="96" width="572" height="256" rx="14" stroke="#859cff"/>
  <text class="label" x="384" y="124" fill="#859cff">Salle</text>

  <rect class="case" x="384" y="140" width="220" height="38" rx="8" stroke="#00eaff"/>
  <g class="avant3"><text class="label" x="400" y="166" fill="#00eaff">web</text><text class="petit" x="458" y="166">image v1</text></g>
  <g class="neuf"><rect class="case" x="384" y="140" width="220" height="38" rx="8" stroke="#00eaff" stroke-width="4"/><text class="label" x="400" y="166" fill="#00eaff">web</text><text class="petit" x="458" y="166">image v2</text></g>

  <rect class="case" x="384" y="194" width="220" height="38" rx="8" stroke="#5affb6"/>
  <text class="label" x="400" y="220" fill="#5affb6">db</text><text class="petit" x="458" y="220">mariadb:11.4</text>

  <rect x="384" y="248" width="220" height="38" rx="8" fill="none" stroke="#a0a4a0" stroke-width="2" stroke-dasharray="6 5"/>
  <g class="avant3"><text class="petit" x="400" y="273">absent</text></g>
  <g class="neuf"><rect class="case" x="384" y="248" width="220" height="38" rx="8" stroke="#859cff" stroke-width="4"/><text class="label" x="400" y="274" fill="#859cff">réseau</text><text class="petit" x="486" y="274">backend</text></g>

  <rect class="case" x="384" y="302" width="220" height="38" rx="8" stroke="#ff84ef"/>
  <text class="label" x="400" y="328" fill="#ff84ef">volume</text><text class="petit" x="486" y="328">db_data</text>

  <!-- Comparaison -->
  <rect class="scan" x="376" y="136" width="552" height="46" rx="8" fill="#eeff57" fill-opacity=".14" stroke="#eeff57" stroke-width="2"/>
  <text class="label b1" x="628" y="166" fill="#ff84ef">≠ différent</text>
  <text class="label b2" x="628" y="220" fill="#a0a4a0">= conforme</text>
  <text class="label b3" x="628" y="274" fill="#eeff57">manque</text>
  <text class="label b4" x="628" y="328" fill="#a0a4a0">= conforme</text>
  <g class="s3">
    <text class="label" x="628" y="166" fill="#00eaff">↻ recréé</text>
    <text class="petit" x="628" y="220">pas touché</text>
    <text class="label" x="628" y="274" fill="#5affb6">+ créé</text>
    <text class="petit" x="628" y="328">pas touché</text>
  </g>
  <g class="s1"><text class="petit" x="628" y="166">web tourne en v1</text><text class="petit" x="628" y="274">réseau absent</text></g>

  <!-- Légende -->
  <rect x="0" y="366" width="960" height="54" fill="#15101a"/>
  <text class="legende" x="32" y="400">Tu tiens <tspan fill="#eeff57" font-weight="700">le plan</tspan> à jour ; Compose fait converger la salle, sur un seul hôte.</text>
</svg>
