# ============================================================================
# Configuration Zensical · cours Conteneurisation et orchestration
# Doc : https://zensical.org/docs/
# ============================================================================

[project]
site_name = "Conteneurisation & orchestration"
site_description = "Cours complet : conteneurs, images, Docker Compose, sécurité et Kubernetes, avec cas d'usage, schémas et mini-labs."
site_author = "Thibaut Gianola"
site_url = "https://astronas.github.io/Ynov---Containerization-Orchestration/"
repo_url = "https://github.com/astronas/Ynov---Containerization-Orchestration"
repo_name = "astronas/Ynov---Containerization-Orchestration"
edit_uri = "edit/main/docs/"
copyright = """
Copyright &copy; 2026 Thibaut Gianola · YNOV Campus Sophia-Antipolis · M2 Expert Cloud, Sécurité &amp; Infrastructure
"""

# Sources générées par scripts/preparer_site.py à partir de docs/.
docs_dir = "build_docs"
site_dir = "site"

extra_css = ["stylesheets/extra.css"]

nav = [
  { "Accueil" = "index.md" },
  { "Comprendre" = [
    { "Du monolithe aux microservices" = "Du-monolithe-aux-microservices.md" },
    { "Machine virtuelle ou conteneur" = "Machine-virtuelle-ou-conteneur.md" },
    { "Isolation : namespaces, cgroups, protections" = "Isolation-des-conteneurs.md" },
    { "Image et cycle de vie" = "Image-et-cycle-de-vie.md" },
  ] },
  { "Images" = [
    { "Les couches d'une image" = "Couches-d-une-image.md" },
    { "Écrire un Dockerfile" = "Ecrire-un-Dockerfile.md" },
    { "Contexte de build et cache" = "Contexte-de-build-et-cache.md" },
    { "Versionner et publier" = "Versionner-et-publier-une-image.md" },
  ] },
  { "Application complète" = [
    { "Réseaux et ports" = "Reseaux-et-ports.md" },
    { "Stockage et volumes" = "Stockage-et-volumes.md" },
    { "Docker Compose" = "Docker-Compose.md" },
    { "Démarré n'est pas disponible" = "Demarre-n-est-pas-disponible.md" },
  ] },
  { "Sécurité" = [
    { "Sécurité des images" = "Securite-des-images.md" },
    { "Identités et privilèges" = "Identites-et-privileges.md" },
    { "Secrets, fichiers, réseau, ressources" = "Secrets-fichiers-reseau-ressources.md" },
  ] },
  { "Orchestration" = [
    { "Pourquoi orchestrer ?" = "Pourquoi-orchestrer.md" },
    { "Kubernetes : état désiré" = "Kubernetes-etat-desire.md" },
    { "Pod, Deployment, ReplicaSet" = "Pod-Deployment-ReplicaSet.md" },
    { "Service et Ingress" = "Service-et-Ingress.md" },
    { "De Compose à Kubernetes" = "De-Compose-a-Kubernetes.md" },
    { "Virtualisation et orchestration" = "Virtualisation-et-orchestration.md" },
  ] },
]

# ----------------------------------------------------------------------------
# Thème
# ----------------------------------------------------------------------------
[project.theme]
language = "fr"
custom_dir = "overrides"
logo = "assets/logo_ynov_white.png"
favicon = "assets/favicon.svg"

features = [
  "announce.dismiss",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "navigation.footer",
  "toc.follow",
  "toc.integrate",
  "search.highlight",
  "content.code.copy",
  "content.code.annotate",
  "content.code.select",
  "content.tooltips",
  "content.action.edit",
  "content.action.view",
]

[project.theme.font]
text = "Inter"  # titres : Bahnschrift / Barlow Semi Condensed (extra.css)
code = "JetBrains Mono"

# Palette : couleurs de marque YNOV via "custom" (variables dans docs/stylesheets/extra.css).
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Basculer en mode sombre"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Basculer en mode clair"

# ----------------------------------------------------------------------------
# Pied de page
# ----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/astronas/Ynov---Containerization-Orchestration"
name = "Dépôt GitHub du cours"

[[project.extra.social]]
icon = "fontawesome/solid/graduation-cap"
link = "https://www.ynov.com"
name = "YNOV Campus"

# ----------------------------------------------------------------------------
# Extensions Markdown
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
title = "Sur cette page"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
